<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1208">
<title>木漏れ日</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #050803;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* 葉のキャンバスは軽くソフトフォーカス */
  #leaves { filter: blur(0.6px); }
  /* 光のキャンバスをほんのり広げて bloom 風に */
  #bloom {
    mix-blend-mode: screen;
    filter: blur(18px);
    opacity: 0.55;
    pointer-events: none;
  }
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 25%, transparent 35%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }
  .hint {
    position: absolute;
    bottom: max(14px, env(safe-area-inset-bottom));
    left: 0; right: 0; text-align: center;
    color: rgba(255,240,200,0.35);
    font: 11px/1 -apple-system, "Hiragino Sans", sans-serif;
    letter-spacing: 0.2em;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky"></canvas>
  <canvas id="bloom"></canvas>
  <canvas id="leaves"></canvas>
  <div class="vignette"></div>
  <div class="hint">TAP&nbsp;:&nbsp;WIND</div>
</div>
<script>
(() => {
  const sky    = document.getElementById('sky');
  const bloom  = document.getElementById('bloom');
  const leavesCv = document.getElementById('leaves');
  const sCtx = sky.getContext('2d');
  const bCtx = bloom.getContext('2d');
  const lCtx = leavesCv.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth;
    H = innerHeight;
    for (const cv of [sky, bloom, leavesCv]) {
      cv.width  = Math.floor(W * DPR);
      cv.height = Math.floor(H * DPR);
    }
    sCtx.setTransform(DPR,0,0,DPR,0,0);
    bCtx.setTransform(DPR,0,0,DPR,0,0);
    lCtx.setTransform(DPR,0,0,DPR,0,0);
    rebuild();
  }

  // ---- 葉のシルエット（広葉樹 / 非対称、種類を3パターン用意） ----
  // 単位サイズで描く。後で scale/rotate して使う。
  const leafShapes = [
    // 楕円系（桂・桜風）
    (ctx, s) => {
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.bezierCurveTo( s*0.55, -s*0.85,  s*0.65, -s*0.1,  s*0.50,  s*0.40);
      ctx.bezierCurveTo( s*0.35,  s*0.78,  s*0.12,  s*0.95, 0,        s);
      ctx.bezierCurveTo(-s*0.12,  s*0.95, -s*0.35,  s*0.78, -s*0.50,  s*0.40);
      ctx.bezierCurveTo(-s*0.65, -s*0.1, -s*0.55, -s*0.85, 0,        -s);
      ctx.fill();
    },
    // 三裂葉（楓風）
    (ctx, s) => {
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.bezierCurveTo( s*0.30, -s*0.85,  s*0.80, -s*0.55,  s*0.95, -s*0.10);
      ctx.bezierCurveTo( s*0.55, -s*0.05,  s*0.65,  s*0.25,  s*0.45,  s*0.45);
      ctx.bezierCurveTo( s*0.30,  s*0.65,  s*0.15,  s*0.85, 0,        s);
      ctx.bezierCurveTo(-s*0.15,  s*0.85, -s*0.30,  s*0.65, -s*0.45,  s*0.45);
      ctx.bezierCurveTo(-s*0.65,  s*0.25, -s*0.55, -s*0.05, -s*0.95, -s*0.10);
      ctx.bezierCurveTo(-s*0.80, -s*0.55, -s*0.30, -s*0.85, 0,       -s);
      ctx.fill();
    },
    // 細長葉（柳〜笹風）
    (ctx, s) => {
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.bezierCurveTo( s*0.30, -s*0.5,  s*0.32,  s*0.5, 0,  s);
      ctx.bezierCurveTo(-s*0.32,  s*0.5, -s*0.30, -s*0.5, 0, -s);
      ctx.fill();
    },
  ];

  // ---- ランタイムデータ ----
  let trees = [];    // 樹（枝の階層 + 葉）
  let bokeh = [];    // 木漏れ日の光斑
  let sunX = 0, sunY = 0;  // 太陽位置
  let parallaxX = 0, parallaxY = 0; // 端末傾き
  let wind = 0;      // 風の強さ（タップで増加、減衰）

  function rand(a, b) { return a + Math.random() * (b - a); }

  // 枝を再帰生成（子枝・葉も含む）
  function buildBranch(x1, y1, angle, len, thickness, depth) {
    const x2 = x1 + Math.cos(angle) * len;
    const y2 = y1 + Math.sin(angle) * len;
    const br = {
      x1, y1, x2, y2,
      thickness,
      depth,
      phase: rand(0, Math.PI * 2),
      // 先端ほど大きく揺れる
      swayAmp: 0.4 + depth * 0.7,
      children: [],
      leaves: [],
    };
    if (depth < 6 && len > 18) {
      const av = rand(0.22, 0.55);
      const lf = rand(0.62, 0.82);
      br.children.push(buildBranch(x2, y2, angle + av,        len * lf, thickness * 0.66, depth + 1));
      br.children.push(buildBranch(x2, y2, angle - av,        len * lf, thickness * 0.66, depth + 1));
      if (Math.random() < 0.45) {
        br.children.push(buildBranch(x2, y2, angle + rand(-0.10, 0.10), len * 0.85, thickness * 0.82, depth + 1));
      }
    }
    // 葉：枝先と、ある程度奥の枝の中腹にも
    const isTip = br.children.length === 0;
    const tipCount = isTip ? (8 + Math.floor(Math.random() * 6)) : 0;
    const midCount = (depth >= 2 && !isTip) ? (2 + Math.floor(Math.random() * 3)) : 0;
    // 直行ベクトル（葉の中腹散らし用）
    const dx = (x2 - x1), dy = (y2 - y1);
    const dlen = Math.hypot(dx, dy) || 1;
    const px = -dy / dlen, py = dx / dlen;
    function pushLeaf(anchorX, anchorY, spread) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * spread;
      br.leaves.push({
        ox: anchorX + Math.cos(a) * r,
        oy: anchorY + Math.sin(a) * r,
        size: rand(13, 24) * (0.85 + depth * 0.05),
        rot: rand(0, Math.PI * 2),
        shape: leafShapes[(Math.random() * leafShapes.length) | 0],
        flutterPhase: rand(0, Math.PI * 2),
        flutterSpeed: rand(2.0, 4.5),
        flutterAmp: rand(0.05, 0.16),
        rim: rand(0.05, 0.16),
      });
    }
    // 葉は枝の x2 を基準（drawLeaves で br.x2+sway に加算）
    for (let i = 0; i < tipCount; i++) pushLeaf(0, 0, 32);
    for (let i = 0; i < midCount; i++) {
      // 枝の中腹からの相対座標
      const t = rand(-0.6, -0.15);  // x2 から始原方向に戻る
      const along = t * dlen;
      const ax = Math.cos(angle) * along;
      const ay = Math.sin(angle) * along;
      const side = rand(-12, 12);
      pushLeaf(ax + px * side, ay + py * side, 8);
    }
    return br;
  }

  function rebuild() {
    sunX = W * 0.55;
    sunY = H * 0.18;

    // ---- 樹を配置 ----
    trees = [];
    // 主役：左下から伸びる大木
    trees.push(buildBranch(W * 0.18, H * 1.02, -Math.PI/2 - 0.12, H * 0.32, 28, 0));
    // 右下から伸びる中木
    trees.push(buildBranch(W * 0.88, H * 1.04, -Math.PI/2 + 0.14, H * 0.27, 22, 0));
    // 奥の小ぶりな樹（中央後ろ）
    trees.push(buildBranch(W * 0.55, H * 1.10, -Math.PI/2 - 0.02, H * 0.22, 16, 0));

    // ---- 光斑：葉の隙間から漏れる光（円形 bokeh） ----
    bokeh = [];
    const area = W * H;
    const bokehCount = Math.round(area / 26000);
    for (let i = 0; i < bokehCount; i++) {
      // 太陽寄りに集めるが、全画面に散らす
      const ang = rand(0, Math.PI * 2);
      const dist = Math.pow(Math.random(), 0.6) * Math.min(W, H) * 0.7;
      const x = sunX + Math.cos(ang) * dist;
      const y = sunY + Math.sin(ang) * dist * 1.2;
      const dxToSun = Math.hypot(x - sunX, y - sunY);
      const closeness = 1 - Math.min(1, dxToSun / (Math.max(W, H) * 0.7));
      bokeh.push({
        x, y,
        r: rand(18, 70) * (0.7 + closeness * 0.8),
        brightness: 0.35 + closeness * 0.55,
        tint: rand(0, 1),  // 0=暖白 1=ややオレンジ
        wobblePhase: rand(0, Math.PI * 2),
        wobbleSpeed: rand(0.3, 0.9),
        wobbleAmp: rand(2, 6),
      });
    }
    // 大きい光斑を後で描画（前にくる）
    bokeh.sort((a, b) => a.r - b.r);
  }

  // ---- 描画 ----
  function drawSky() {
    // 空（実際は梢の隙間から見える明るい層）
    const g = sCtx.createRadialGradient(sunX, sunY, 0, sunX, sunY, Math.max(W, H) * 0.95);
    g.addColorStop(0.00, '#fffbe8');
    g.addColorStop(0.10, '#fff0c0');
    g.addColorStop(0.30, '#e9b86a');
    g.addColorStop(0.55, '#8a5a2a');
    g.addColorStop(0.85, '#2a1b0c');
    g.addColorStop(1.00, '#0c0703');
    sCtx.fillStyle = g;
    sCtx.fillRect(0, 0, W, H);

    // 太陽コア
    const sg = sCtx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 140);
    sg.addColorStop(0, 'rgba(255,255,240,1)');
    sg.addColorStop(0.4, 'rgba(255,235,180,0.55)');
    sg.addColorStop(1, 'rgba(255,210,120,0)');
    sCtx.fillStyle = sg;
    sCtx.beginPath();
    sCtx.arc(sunX, sunY, 140, 0, Math.PI * 2);
    sCtx.fill();
  }

  function drawBokeh(t) {
    // 光斑を screen 合成で
    sCtx.globalCompositeOperation = 'screen';
    for (const b of bokeh) {
      const wob = Math.sin(t * b.wobbleSpeed + b.wobblePhase) * b.wobbleAmp;
      const x = b.x + wob + parallaxX * 4;
      const y = b.y + Math.cos(t * b.wobbleSpeed * 0.7 + b.wobblePhase) * b.wobbleAmp * 0.4 + parallaxY * 4;
      const g = sCtx.createRadialGradient(x, y, 0, x, y, b.r);
      const warm = b.tint;
      const r = 255, gC = Math.round(245 - warm * 30), bC = Math.round(210 - warm * 90);
      g.addColorStop(0,    `rgba(${r},${gC},${bC},${b.brightness})`);
      g.addColorStop(0.55, `rgba(${r},${gC-15},${bC-30},${b.brightness*0.35})`);
      g.addColorStop(1,    `rgba(${r},${gC-30},${bC-60},0)`);
      sCtx.fillStyle = g;
      sCtx.beginPath();
      sCtx.arc(x, y, b.r, 0, Math.PI * 2);
      sCtx.fill();
    }
    sCtx.globalCompositeOperation = 'source-over';
  }

  function drawBloom() {
    // bloom 用：明るい光斑だけ別キャンバスに描く（CSS でぼかして加算）
    bCtx.clearRect(0, 0, W, H);
    bCtx.globalCompositeOperation = 'lighter';
    for (const b of bokeh) {
      if (b.brightness < 0.5) continue;
      const g = bCtx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 1.6);
      g.addColorStop(0, `rgba(255,240,200,${b.brightness * 0.7})`);
      g.addColorStop(1, 'rgba(255,200,120,0)');
      bCtx.fillStyle = g;
      bCtx.beginPath();
      bCtx.arc(b.x, b.y, b.r * 1.6, 0, Math.PI * 2);
      bCtx.fill();
    }
    bCtx.globalCompositeOperation = 'source-over';
  }

  // 枝を再帰描画（先端ほど揺れる：親の sway を累積して渡す）
  function drawBranches(br, t, accSway) {
    const mySway = Math.sin(t * 0.55 + br.phase) * br.swayAmp * (1 + wind * 3);
    const tipSway = accSway + mySway;
    const px = parallaxX * (3 + br.depth * 4);
    const py = parallaxY * (2 + br.depth * 2);

    lCtx.strokeStyle = `rgba(2, 8, 5, 0.97)`;
    lCtx.lineCap = 'round';
    lCtx.lineWidth = br.thickness;
    lCtx.beginPath();
    lCtx.moveTo(br.x1 + accSway + px, br.y1 + py);
    const mx = (br.x1 + br.x2) / 2 + (accSway + tipSway) * 0.5 + px;
    const my = (br.y1 + br.y2) / 2 + py;
    lCtx.quadraticCurveTo(mx, my, br.x2 + tipSway + px, br.y2 + py);
    lCtx.stroke();

    for (const child of br.children) {
      drawBranches(child, t, tipSway);
    }
    return tipSway;
  }

  function drawLeavesForBranch(br, t, accSway) {
    const mySway = Math.sin(t * 0.55 + br.phase) * br.swayAmp * (1 + wind * 3);
    const tipSway = accSway + mySway;
    const px = parallaxX * (6 + br.depth * 6);
    const py = parallaxY * (3 + br.depth * 4);

    for (const lf of br.leaves) {
      const flutter = Math.sin(t * lf.flutterSpeed + lf.flutterPhase) * lf.flutterAmp
                    + wind * 0.35 * Math.sin(lf.flutterPhase);
      lCtx.save();
      lCtx.translate(br.x2 + tipSway + lf.ox + px, br.y2 + lf.oy + py);
      lCtx.rotate(lf.rot + flutter);
      lCtx.fillStyle = 'rgba(3, 10, 5, 0.94)';
      lf.shape(lCtx, lf.size);
      // 葉縁のかすかな透過光
      lCtx.globalCompositeOperation = 'lighter';
      lCtx.fillStyle = `rgba(140, 200, 100, ${lf.rim * 0.18})`;
      lf.shape(lCtx, lf.size * 1.04);
      lCtx.globalCompositeOperation = 'source-over';
      lCtx.restore();
    }
    for (const child of br.children) {
      drawLeavesForBranch(child, t, tipSway);
    }
  }

  function drawTrees(t) {
    lCtx.clearRect(0, 0, W, H);
    // 枝 → 葉 の順で2パス
    for (const root of trees) drawBranches(root, t, 0);
    for (const root of trees) drawLeavesForBranch(root, t, 0);
  }

  // ---- 主ループ ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;

    wind *= Math.pow(0.6, dt); // 減衰

    drawSky();
    drawBokeh(t);
    drawBloom();
    drawTrees(t);

    requestAnimationFrame(frame);
  }

  // ---- インタラクション ----
  function gust() {
    wind = Math.min(1.5, wind + 0.9);
  }
  addEventListener('touchstart', gust, { passive: true });
  addEventListener('click', gust);

  // 端末の傾き
  let permRequested = false;
  function enableTilt() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function' &&
        !permRequested) {
      permRequested = true;
      DeviceOrientationEvent.requestPermission().catch(() => {});
    }
  }
  addEventListener('touchend', enableTilt, { once: true });
  addEventListener('deviceorientation', (e) => {
    const g = (e.gamma || 0) / 45;   // -1..1
    const b = ((e.beta || 0) - 45) / 45;
    parallaxX = Math.max(-1, Math.min(1, g));
    parallaxY = Math.max(-1, Math.min(1, b));
  });

  // 初期化
  resize();
  addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
