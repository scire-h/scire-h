<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1208">
<title>木漏れ日</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #050803;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  /* 葉のキャンバスは軽くソフトフォーカス */
  #leaves { filter: blur(0.6px); }
  /* 光のキャンバスをほんのり広げて bloom 風に */
  #bloom {
    mix-blend-mode: screen;
    filter: blur(18px);
    opacity: 0.55;
    pointer-events: none;
  }
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 25%, transparent 35%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }
  .hint {
    position: absolute;
    bottom: max(14px, env(safe-area-inset-bottom));
    left: 0; right: 0; text-align: center;
    color: rgba(255,240,200,0.35);
    font: 11px/1 -apple-system, "Hiragino Sans", sans-serif;
    letter-spacing: 0.2em;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky"></canvas>
  <canvas id="bloom"></canvas>
  <canvas id="leaves"></canvas>
  <div class="vignette"></div>
  <div class="hint">TAP&nbsp;:&nbsp;WIND</div>
</div>
<script>
(() => {
  const sky    = document.getElementById('sky');
  const bloom  = document.getElementById('bloom');
  const leavesCv = document.getElementById('leaves');
  const sCtx = sky.getContext('2d');
  const bCtx = bloom.getContext('2d');
  const lCtx = leavesCv.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth;
    H = innerHeight;
    for (const cv of [sky, bloom, leavesCv]) {
      cv.width  = Math.floor(W * DPR);
      cv.height = Math.floor(H * DPR);
    }
    sCtx.setTransform(DPR,0,0,DPR,0,0);
    bCtx.setTransform(DPR,0,0,DPR,0,0);
    lCtx.setTransform(DPR,0,0,DPR,0,0);
    rebuild();
  }

  // ---- 葉のシルエット（広葉樹 / 非対称、種類を3パターン用意） ----
  // 単位サイズで描く。後で scale/rotate して使う。
  const leafShapes = [
    // 楕円系（桂・桜風）
    (ctx, s) => {
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.bezierCurveTo( s*0.55, -s*0.85,  s*0.65, -s*0.1,  s*0.50,  s*0.40);
      ctx.bezierCurveTo( s*0.35,  s*0.78,  s*0.12,  s*0.95, 0,        s);
      ctx.bezierCurveTo(-s*0.12,  s*0.95, -s*0.35,  s*0.78, -s*0.50,  s*0.40);
      ctx.bezierCurveTo(-s*0.65, -s*0.1, -s*0.55, -s*0.85, 0,        -s);
      ctx.fill();
    },
    // 三裂葉（楓風）
    (ctx, s) => {
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.bezierCurveTo( s*0.30, -s*0.85,  s*0.80, -s*0.55,  s*0.95, -s*0.10);
      ctx.bezierCurveTo( s*0.55, -s*0.05,  s*0.65,  s*0.25,  s*0.45,  s*0.45);
      ctx.bezierCurveTo( s*0.30,  s*0.65,  s*0.15,  s*0.85, 0,        s);
      ctx.bezierCurveTo(-s*0.15,  s*0.85, -s*0.30,  s*0.65, -s*0.45,  s*0.45);
      ctx.bezierCurveTo(-s*0.65,  s*0.25, -s*0.55, -s*0.05, -s*0.95, -s*0.10);
      ctx.bezierCurveTo(-s*0.80, -s*0.55, -s*0.30, -s*0.85, 0,       -s);
      ctx.fill();
    },
    // 細長葉（柳〜笹風）
    (ctx, s) => {
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.bezierCurveTo( s*0.30, -s*0.5,  s*0.32,  s*0.5, 0,  s);
      ctx.bezierCurveTo(-s*0.32,  s*0.5, -s*0.30, -s*0.5, 0, -s);
      ctx.fill();
    },
  ];

  // ---- ランタイムデータ ----
  let leaves = [];   // 葉
  let bokeh = [];    // 木漏れ日の光斑
  let sunX = 0, sunY = 0;  // 太陽位置
  let parallaxX = 0, parallaxY = 0; // 端末傾き
  let wind = 0;      // 風の強さ（タップで増加、減衰）

  function rand(a, b) { return a + Math.random() * (b - a); }

  function rebuild() {
    sunX = W * 0.55;
    sunY = H * 0.18;

    // 葉：枝に沿って集まるように、いくつかの「房」を作る
    leaves = [];
    const area = W * H;
    const clusters = Math.round(area / 18000);     // クラスター数（密度）
    const perCluster = 7;
    for (let c = 0; c < clusters; c++) {
      const cx = rand(-W*0.1, W*1.1);
      const cy = rand(-H*0.1, H*0.95);
      const baseDepth = rand(0, 1);          // 0:奥(小・速い揺れ) 1:手前(大・遅い揺れ)
      for (let i = 0; i < perCluster; i++) {
        const depth = Math.max(0, Math.min(1, baseDepth + rand(-0.15, 0.15)));
        const spread = 70 + depth * 50;
        leaves.push({
          x: cx + rand(-spread, spread),
          y: cy + rand(-spread*0.7, spread*0.7),
          size: rand(14, 34) * (0.6 + depth * 0.8),
          rot: rand(0, Math.PI * 2),
          shape: leafShapes[(Math.random() * leafShapes.length) | 0],
          depth,
          swayAmp: rand(2, 7),
          swayPhase: rand(0, Math.PI * 2),
          swaySpeed: rand(0.4, 0.9),
          flutterAmp: rand(0.04, 0.14),
          flutterPhase: rand(0, Math.PI * 2),
          flutterSpeed: rand(2.0, 4.5),
          // 葉先のかすかな透過光
          rim: rand(0.05, 0.18),
        });
      }
    }
    // 奥行き順に描画
    leaves.sort((a, b) => a.depth - b.depth);

    // 光斑：葉の隙間から漏れる光（円形 bokeh）
    bokeh = [];
    const bokehCount = Math.round(area / 26000);
    for (let i = 0; i < bokehCount; i++) {
      // 太陽寄りに集めるが、全画面に散らす
      const ang = rand(0, Math.PI * 2);
      const dist = Math.pow(Math.random(), 0.6) * Math.min(W, H) * 0.7;
      const x = sunX + Math.cos(ang) * dist;
      const y = sunY + Math.sin(ang) * dist * 1.2;
      const dxToSun = Math.hypot(x - sunX, y - sunY);
      const closeness = 1 - Math.min(1, dxToSun / (Math.max(W, H) * 0.7));
      bokeh.push({
        x, y,
        r: rand(18, 70) * (0.7 + closeness * 0.8),
        brightness: 0.35 + closeness * 0.55,
        tint: rand(0, 1),  // 0=暖白 1=ややオレンジ
        wobblePhase: rand(0, Math.PI * 2),
        wobbleSpeed: rand(0.3, 0.9),
        wobbleAmp: rand(2, 6),
      });
    }
    // 大きい光斑を後で描画（前にくる）
    bokeh.sort((a, b) => a.r - b.r);
  }

  // ---- 描画 ----
  function drawSky() {
    // 空（実際は梢の隙間から見える明るい層）
    const g = sCtx.createRadialGradient(sunX, sunY, 0, sunX, sunY, Math.max(W, H) * 0.95);
    g.addColorStop(0.00, '#fffbe8');
    g.addColorStop(0.10, '#fff0c0');
    g.addColorStop(0.30, '#e9b86a');
    g.addColorStop(0.55, '#8a5a2a');
    g.addColorStop(0.85, '#2a1b0c');
    g.addColorStop(1.00, '#0c0703');
    sCtx.fillStyle = g;
    sCtx.fillRect(0, 0, W, H);

    // 太陽コア
    const sg = sCtx.createRadialGradient(sunX, sunY, 0, sunX, sunY, 140);
    sg.addColorStop(0, 'rgba(255,255,240,1)');
    sg.addColorStop(0.4, 'rgba(255,235,180,0.55)');
    sg.addColorStop(1, 'rgba(255,210,120,0)');
    sCtx.fillStyle = sg;
    sCtx.beginPath();
    sCtx.arc(sunX, sunY, 140, 0, Math.PI * 2);
    sCtx.fill();
  }

  function drawBokeh(t) {
    // 光斑を screen 合成で
    sCtx.globalCompositeOperation = 'screen';
    for (const b of bokeh) {
      const wob = Math.sin(t * b.wobbleSpeed + b.wobblePhase) * b.wobbleAmp;
      const x = b.x + wob + parallaxX * 4;
      const y = b.y + Math.cos(t * b.wobbleSpeed * 0.7 + b.wobblePhase) * b.wobbleAmp * 0.4 + parallaxY * 4;
      const g = sCtx.createRadialGradient(x, y, 0, x, y, b.r);
      const warm = b.tint;
      const r = 255, gC = Math.round(245 - warm * 30), bC = Math.round(210 - warm * 90);
      g.addColorStop(0,    `rgba(${r},${gC},${bC},${b.brightness})`);
      g.addColorStop(0.55, `rgba(${r},${gC-15},${bC-30},${b.brightness*0.35})`);
      g.addColorStop(1,    `rgba(${r},${gC-30},${bC-60},0)`);
      sCtx.fillStyle = g;
      sCtx.beginPath();
      sCtx.arc(x, y, b.r, 0, Math.PI * 2);
      sCtx.fill();
    }
    sCtx.globalCompositeOperation = 'source-over';
  }

  function drawBloom() {
    // bloom 用：明るい光斑だけ別キャンバスに描く（CSS でぼかして加算）
    bCtx.clearRect(0, 0, W, H);
    bCtx.globalCompositeOperation = 'lighter';
    for (const b of bokeh) {
      if (b.brightness < 0.5) continue;
      const g = bCtx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 1.6);
      g.addColorStop(0, `rgba(255,240,200,${b.brightness * 0.7})`);
      g.addColorStop(1, 'rgba(255,200,120,0)');
      bCtx.fillStyle = g;
      bCtx.beginPath();
      bCtx.arc(b.x, b.y, b.r * 1.6, 0, Math.PI * 2);
      bCtx.fill();
    }
    bCtx.globalCompositeOperation = 'source-over';
  }

  function drawLeaves(t) {
    lCtx.clearRect(0, 0, W, H);
    for (const lf of leaves) {
      // 揺れ
      const swayBase = Math.sin(t * lf.swaySpeed + lf.swayPhase);
      const sway = swayBase * lf.swayAmp + wind * 18 * (1 - lf.depth * 0.5);
      const flutter = Math.sin(t * lf.flutterSpeed + lf.flutterPhase) * lf.flutterAmp
                    + wind * 0.4 * Math.sin(lf.flutterPhase);
      // パララックス（手前ほど大きく動く）
      const px = parallaxX * (8 + lf.depth * 14);
      const py = parallaxY * (4 + lf.depth * 8);

      lCtx.save();
      lCtx.translate(lf.x + sway + px, lf.y + py);
      lCtx.rotate(lf.rot + flutter);

      // 葉の本体（ほぼ黒シルエット）
      lCtx.fillStyle = `rgba(3, 10, 5, ${0.88 + lf.depth * 0.10})`;
      lf.shape(lCtx, lf.size);

      // 葉縁のうっすらした透過光（backlit）
      lCtx.globalCompositeOperation = 'lighter';
      lCtx.strokeStyle = `rgba(150, 210, 110, ${lf.rim * (0.5 + (1 - lf.depth) * 0.5)})`;
      lCtx.lineWidth = 0.8;
      lf.shape(lCtx, lf.size * 1.02);
      // stroke は path を再生成しないと出ないので、shape を上書き：上の shape は fill のみ。
      // 代わりに小さく明るい再 fill で疑似リムを出す
      lCtx.globalCompositeOperation = 'source-over';

      lCtx.restore();
    }
  }

  // ---- 主ループ ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;

    wind *= Math.pow(0.6, dt); // 減衰

    drawSky();
    drawBokeh(t);
    drawBloom();
    drawLeaves(t);

    requestAnimationFrame(frame);
  }

  // ---- インタラクション ----
  function gust() {
    wind = Math.min(1.5, wind + 0.9);
  }
  addEventListener('touchstart', gust, { passive: true });
  addEventListener('click', gust);

  // 端末の傾き
  let permRequested = false;
  function enableTilt() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function' &&
        !permRequested) {
      permRequested = true;
      DeviceOrientationEvent.requestPermission().catch(() => {});
    }
  }
  addEventListener('touchend', enableTilt, { once: true });
  addEventListener('deviceorientation', (e) => {
    const g = (e.gamma || 0) / 45;   // -1..1
    const b = ((e.beta || 0) - 45) / 45;
    parallaxX = Math.max(-1, Math.min(1, g));
    parallaxY = Math.max(-1, Math.min(1, b));
  });

  // 初期化
  resize();
  addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
