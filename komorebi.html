<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a2818">
<title>木漏れ日</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0f1a0d;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }
  .stage {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 50% 0%, #6b8a4a 0%, #2d4a2a 35%, #0f1a0d 80%);
    overflow: hidden;
  }

  /* 外光：白いふんわりした光源（後ろから差し込む） */
  .sun {
    position: absolute;
    top: -10%;
    left: 50%;
    width: 80vmin;
    height: 80vmin;
    transform: translateX(-50%);
    background: radial-gradient(circle,
      rgba(255, 246, 200, 0.9) 0%,
      rgba(255, 230, 150, 0.55) 20%,
      rgba(255, 220, 130, 0.25) 40%,
      rgba(255, 200, 100, 0) 70%);
    filter: blur(40px);
    animation: sunShimmer 8s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes sunShimmer {
    0%   { opacity: 0.85; transform: translateX(-52%) scale(1); }
    50%  { opacity: 1;    transform: translateX(-48%) scale(1.05); }
    100% { opacity: 0.9;  transform: translateX(-50%) scale(0.98); }
  }

  /* 光の粒（木漏れ日の床への光斑） */
  .light-spots {
    position: absolute;
    inset: 0;
    pointer-events: none;
    filter: blur(8px);
    mix-blend-mode: screen;
  }
  .spot {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,240,180,0.7), rgba(255,220,120,0));
    animation: drift var(--dur, 12s) ease-in-out infinite alternate;
  }
  @keyframes drift {
    0%   { transform: translate(0,0) scale(1);   opacity: 0.4; }
    50%  { transform: translate(var(--dx,20px), var(--dy,15px)) scale(1.15); opacity: 0.9; }
    100% { transform: translate(calc(var(--dx,20px) * -0.6), calc(var(--dy,15px) * 0.4)) scale(0.95); opacity: 0.5; }
  }

  /* 葉のレイヤー */
  .leaves {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .leaves svg {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* 奥のレイヤー（ぼけ強め・暗め） */
  .layer-back  { filter: blur(6px)  brightness(0.35); opacity: 0.85;
                 animation: sway 9s ease-in-out infinite alternate; transform-origin: 50% 0; }
  /* 中間レイヤー */
  .layer-mid   { filter: blur(3px)  brightness(0.18); opacity: 0.95;
                 animation: sway 7s ease-in-out infinite alternate-reverse; transform-origin: 50% 0; }
  /* 前のレイヤー（シルエット濃いめ） */
  .layer-front { filter: blur(1.5px) brightness(0.05); opacity: 1;
                 animation: sway 5s ease-in-out infinite alternate; transform-origin: 50% 0; }

  @keyframes sway {
    0%   { transform: translate(-1%, 0)   rotate(-0.6deg); }
    50%  { transform: translate( 1%, -0.5%) rotate( 0.4deg); }
    100% { transform: translate(-0.5%, 0.3%) rotate(-0.3deg); }
  }

  /* かすかなビネット */
  .vignette {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }

  /* タップで光が増す */
  .stage.tap .sun { animation-duration: 2s; }

  /* 操作ヒント */
  .hint {
    position: absolute;
    bottom: max(16px, env(safe-area-inset-bottom));
    left: 0; right: 0;
    text-align: center;
    color: rgba(255,255,255,0.35);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    pointer-events: none;
    user-select: none;
  }
</style>
</head>
<body>
<div class="stage" id="stage">

  <div class="sun"></div>

  <div class="light-spots" id="spots"></div>

  <!-- 葉のシルエット（広葉樹） -->
  <div class="leaves">
    <!-- 奥 -->
    <svg class="layer-back" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
      <g id="back-leaves" fill="#0a140a"></g>
    </svg>
    <!-- 中 -->
    <svg class="layer-mid" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
      <g id="mid-leaves" fill="#050c05"></g>
    </svg>
    <!-- 前 -->
    <svg class="layer-front" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMin slice" aria-hidden="true">
      <g id="front-leaves" fill="#000"></g>
    </svg>
  </div>

  <div class="vignette"></div>
  <div class="hint">タップで風が吹く</div>
</div>

<script>
  // 広葉樹の葉っぱ形（楕円ベース、先端が尖るシルエット）
  function leafPath(cx, cy, w, h, rot) {
    // 葉っぱ型: 上下に尖った楕円
    const path = `M ${cx} ${cy - h/2}
                  C ${cx + w/2} ${cy - h/2}, ${cx + w/2} ${cy + h/2}, ${cx} ${cy + h/2}
                  C ${cx - w/2} ${cy + h/2}, ${cx - w/2} ${cy - h/2}, ${cx} ${cy - h/2} Z`;
    return `<path d="${path}" transform="rotate(${rot} ${cx} ${cy})"/>`;
  }

  // 不規則なクラスター（小枝に付く複数の葉）
  function leafCluster(cx, cy, scale) {
    let s = '';
    const n = 5 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.random() * 60 * scale;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r * 0.7;
      const w = (30 + Math.random() * 40) * scale;
      const h = (50 + Math.random() * 60) * scale;
      const rot = Math.random() * 360;
      s += leafPath(x, y, w, h, rot);
    }
    return s;
  }

  // レイヤーごとに葉を配置（上部に集中させて木の枝らしく）
  function fillLayer(id, count, scale, yMax) {
    const el = document.getElementById(id);
    let html = '';
    for (let i = 0; i < count; i++) {
      const cx = Math.random() * 1100 - 50;
      const cy = Math.random() * yMax - 50;
      html += leafCluster(cx, cy, scale);
    }
    el.innerHTML = html;
  }

  fillLayer('back-leaves',  18, 1.4, 700);
  fillLayer('mid-leaves',   14, 1.1, 550);
  fillLayer('front-leaves',  9, 0.9, 420);

  // 床に落ちる光斑
  const spots = document.getElementById('spots');
  const spotCount = 14;
  let spotsHtml = '';
  for (let i = 0; i < spotCount; i++) {
    const size = 40 + Math.random() * 100;
    const left = Math.random() * 100;
    const top  = 30 + Math.random() * 65;
    const dx = (Math.random() - 0.5) * 60;
    const dy = (Math.random() - 0.5) * 40;
    const dur = 6 + Math.random() * 10;
    const delay = -Math.random() * 10;
    spotsHtml += `<div class="spot" style="
      width:${size}px;height:${size}px;
      left:${left}%;top:${top}%;
      --dx:${dx}px;--dy:${dy}px;
      --dur:${dur}s;
      animation-delay:${delay}s;
    "></div>`;
  }
  spots.innerHTML = spotsHtml;

  // タップで一瞬風が強くなる
  const stage = document.getElementById('stage');
  function gust() {
    stage.classList.add('tap');
    document.querySelectorAll('.layer-back, .layer-mid, .layer-front').forEach(el => {
      el.style.animationDuration = '1.2s';
    });
    setTimeout(() => {
      stage.classList.remove('tap');
      document.querySelector('.layer-back').style.animationDuration = '9s';
      document.querySelector('.layer-mid').style.animationDuration = '7s';
      document.querySelector('.layer-front').style.animationDuration = '5s';
    }, 1400);
  }
  stage.addEventListener('touchstart', gust, { passive: true });
  stage.addEventListener('click', gust);

  // デバイスの向き(傾き)で太陽の位置を少し動かす（任意・対応端末のみ）
  window.addEventListener('deviceorientation', (e) => {
    const g = e.gamma || 0;  // 左右の傾き -90 .. 90
    const sun = document.querySelector('.sun');
    sun.style.left = (50 + g * 0.3) + '%';
  });
</script>
</body>
</html>
