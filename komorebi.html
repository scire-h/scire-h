<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#e9c98b">
<title>木漏れ日</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #d8b07a;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #stage { position: fixed; inset: 0; }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    display: block;
  }
  /* 太陽光が当たった壁／床 */
  #wall { z-index: 0; }
  /* 奥（太い枝・房）由来のとても柔らかい影 */
  #shadowSoft {
    z-index: 1;
    filter: blur(22px);
    mix-blend-mode: multiply;
    opacity: 0.85;
  }
  /* 手前（個々の葉）の少しシャープな影 */
  #shadowSharp {
    z-index: 2;
    filter: blur(3.5px);
    mix-blend-mode: multiply;
    opacity: 0.9;
  }
  /* 葉の隙間からの強い光（プチハイライト） */
  #spec {
    z-index: 3;
    mix-blend-mode: screen;
    filter: blur(2px);
    opacity: 0.7;
    pointer-events: none;
  }
  .vignette {
    position: absolute; inset: 0; z-index: 4;
    background: radial-gradient(ellipse at 65% 25%, transparent 45%, rgba(60,30,10,0.30) 100%);
    pointer-events: none;
  }
  .hint {
    position: absolute; z-index: 5;
    bottom: max(14px, env(safe-area-inset-bottom));
    left: 0; right: 0; text-align: center;
    color: rgba(80, 50, 20, 0.45);
    font: 11px/1 -apple-system, "Hiragino Sans", sans-serif;
    letter-spacing: 0.25em;
    pointer-events: none; user-select: none;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="wall"></canvas>
  <canvas id="shadowSoft"></canvas>
  <canvas id="shadowSharp"></canvas>
  <canvas id="spec"></canvas>
  <div class="vignette"></div>
  <div class="hint">TAP&nbsp;:&nbsp;WIND</div>
</div>
<script>
(() => {
  const wall   = document.getElementById('wall');
  const soft   = document.getElementById('shadowSoft');
  const sharp  = document.getElementById('shadowSharp');
  const spec   = document.getElementById('spec');

  const wCtx = wall.getContext('2d');
  const sfCtx = soft.getContext('2d');
  const shCtx = sharp.getContext('2d');
  const spCtx = spec.getContext('2d');

  let W = 0, H = 0, DPR = 1;
  let wallTexture = null;  // 事前生成した壁テクスチャ

  function rand(a, b) { return a + Math.random() * (b - a); }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    for (const cv of [wall, soft, sharp, spec]) {
      cv.width  = Math.floor(W * DPR);
      cv.height = Math.floor(H * DPR);
    }
    wCtx.setTransform(DPR,0,0,DPR,0,0);
    sfCtx.setTransform(DPR,0,0,DPR,0,0);
    shCtx.setTransform(DPR,0,0,DPR,0,0);
    spCtx.setTransform(DPR,0,0,DPR,0,0);
    buildWallTexture();
    rebuild();
  }

  // ---- 壁／床のテクスチャ（一度だけ生成、毎フレーム使い回す） ----
  function buildWallTexture() {
    const off = document.createElement('canvas');
    off.width = W * DPR; off.height = H * DPR;
    const c = off.getContext('2d');
    c.setTransform(DPR,0,0,DPR,0,0);

    // ベース：太陽の方向にむかって明るくなるグラデ
    const g = c.createRadialGradient(W * 0.72, H * 0.22, 0, W * 0.72, H * 0.22, Math.max(W,H));
    g.addColorStop(0.00, '#fff3d4');
    g.addColorStop(0.35, '#f3d8a3');
    g.addColorStop(0.75, '#cc9b62');
    g.addColorStop(1.00, '#7a4f24');
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);

    // ノイズ（紙肌・コンクリート的）
    const img = c.getImageData(0, 0, off.width, off.height);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const n = (Math.random() - 0.5) * 18;
      d[i]   = Math.max(0, Math.min(255, d[i]   + n));
      d[i+1] = Math.max(0, Math.min(255, d[i+1] + n * 0.9));
      d[i+2] = Math.max(0, Math.min(255, d[i+2] + n * 0.8));
    }
    c.putImageData(img, 0, 0);
    wallTexture = off;
  }

  // ---- 葉の形（広葉樹 3 種） ----
  const leafShapes = [
    (ctx, s) => {  // 楕円葉
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.bezierCurveTo( s*0.55, -s*0.85,  s*0.65, -s*0.10,  s*0.50,  s*0.40);
      ctx.bezierCurveTo( s*0.35,  s*0.78,  s*0.12,  s*0.95, 0,        s);
      ctx.bezierCurveTo(-s*0.12,  s*0.95, -s*0.35,  s*0.78, -s*0.50,  s*0.40);
      ctx.bezierCurveTo(-s*0.65, -s*0.10, -s*0.55, -s*0.85, 0,       -s);
      ctx.fill();
    },
    (ctx, s) => {  // 楓風（やや裂葉）
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.bezierCurveTo( s*0.35, -s*0.85,  s*0.90, -s*0.45,  s*0.95, -s*0.10);
      ctx.bezierCurveTo( s*0.55, -s*0.05,  s*0.65,  s*0.30,  s*0.45,  s*0.50);
      ctx.bezierCurveTo( s*0.30,  s*0.70,  s*0.15,  s*0.90, 0,        s);
      ctx.bezierCurveTo(-s*0.15,  s*0.90, -s*0.30,  s*0.70, -s*0.45,  s*0.50);
      ctx.bezierCurveTo(-s*0.65,  s*0.30, -s*0.55, -s*0.05, -s*0.95, -s*0.10);
      ctx.bezierCurveTo(-s*0.90, -s*0.45, -s*0.35, -s*0.85, 0,       -s);
      ctx.fill();
    },
    (ctx, s) => {  // 細長葉
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.bezierCurveTo( s*0.28, -s*0.5,  s*0.30,  s*0.5, 0,  s);
      ctx.bezierCurveTo(-s*0.30,  s*0.5, -s*0.28, -s*0.5, 0, -s);
      ctx.fill();
    },
  ];

  // ---- ランタイムデータ ----
  let clusters = [];  // 大きな房（奥のぼけた影）
  let leaflets = [];  // 個々の葉（手前のシャープな影）
  let gaps = [];      // 葉の隙間（強い光が落ちるところ）
  let wind = 0;
  let parallaxX = 0, parallaxY = 0;
  // 全体ドリフト（無風時もゆっくり流れる）
  let driftX = 0, driftY = 0;

  function rebuild() {
    const area = W * H;

    // 大房（ぼけた影）：画面全体に散らす
    clusters = [];
    const clusterCount = Math.round(area / 28000);
    for (let i = 0; i < clusterCount; i++) {
      clusters.push({
        x: rand(-W*0.1, W*1.1),
        y: rand(-H*0.1, H*1.1),
        rx: rand(80, 220),
        ry: rand(60, 180),
        rot: rand(0, Math.PI * 2),
        alpha: rand(0.18, 0.42),
        phase: rand(0, Math.PI * 2),
        speed: rand(0.10, 0.30),
        amp:   rand(8, 22),
      });
    }

    // 個々の葉：影として
    leaflets = [];
    const leafletCount = Math.round(area / 5500);
    for (let i = 0; i < leafletCount; i++) {
      leaflets.push({
        x: rand(-W*0.1, W*1.1),
        y: rand(-H*0.1, H*1.1),
        size: rand(10, 28),
        rot: rand(0, Math.PI * 2),
        shape: leafShapes[(Math.random() * leafShapes.length) | 0],
        alpha: rand(0.22, 0.50),
        phase: rand(0, Math.PI * 2),
        speed: rand(0.35, 0.75),
        amp:   rand(4, 12),
        flutterPhase: rand(0, Math.PI * 2),
        flutterSpeed: rand(2.0, 4.5),
        flutterAmp:   rand(0.05, 0.18),
      });
    }

    // 葉の隙間から漏れる強い光（ハイライト）
    gaps = [];
    const gapCount = Math.round(area / 22000);
    for (let i = 0; i < gapCount; i++) {
      gaps.push({
        x: rand(0, W),
        y: rand(0, H),
        r: rand(8, 30),
        brightness: rand(0.25, 0.7),
        phase: rand(0, Math.PI * 2),
        speed: rand(0.4, 0.9),
        amp:   rand(3, 10),
      });
    }
  }

  // ---- 描画 ----
  function drawWall() {
    wCtx.clearRect(0, 0, W, H);
    if (wallTexture) {
      wCtx.drawImage(wallTexture, 0, 0, W, H);
    }
  }

  function drawSoftShadows(t) {
    sfCtx.clearRect(0, 0, W, H);
    sfCtx.fillStyle = 'rgba(48, 30, 14, 0.85)';
    for (const cl of clusters) {
      const dx = Math.sin(t * cl.speed + cl.phase) * cl.amp + driftX * 0.6 + wind * 28;
      const dy = Math.cos(t * cl.speed * 0.7 + cl.phase) * cl.amp * 0.6 + driftY * 0.6 + wind * 6;
      sfCtx.save();
      sfCtx.translate(cl.x + dx + parallaxX * 10, cl.y + dy + parallaxY * 6);
      sfCtx.rotate(cl.rot);
      sfCtx.globalAlpha = cl.alpha;
      sfCtx.beginPath();
      sfCtx.ellipse(0, 0, cl.rx, cl.ry, 0, 0, Math.PI * 2);
      sfCtx.fill();
      sfCtx.restore();
    }
  }

  function drawSharpShadows(t) {
    shCtx.clearRect(0, 0, W, H);
    shCtx.fillStyle = 'rgba(40, 25, 12, 1)';
    for (const lf of leaflets) {
      const dx = Math.sin(t * lf.speed + lf.phase) * lf.amp + driftX + wind * 36;
      const dy = Math.cos(t * lf.speed * 0.8 + lf.phase) * lf.amp * 0.5 + driftY + wind * 8;
      const flutter = Math.sin(t * lf.flutterSpeed + lf.flutterPhase) * lf.flutterAmp
                    + wind * 0.4 * Math.sin(lf.flutterPhase);
      shCtx.save();
      shCtx.translate(lf.x + dx + parallaxX * 14, lf.y + dy + parallaxY * 9);
      shCtx.rotate(lf.rot + flutter);
      shCtx.globalAlpha = lf.alpha;
      lf.shape(shCtx, lf.size);
      shCtx.restore();
    }
  }

  function drawSpec(t) {
    spCtx.clearRect(0, 0, W, H);
    for (const sp of gaps) {
      const dx = Math.sin(t * sp.speed + sp.phase) * sp.amp + driftX * 0.8 + wind * 30;
      const dy = Math.cos(t * sp.speed * 0.6 + sp.phase) * sp.amp * 0.5 + driftY * 0.8 + wind * 6;
      const x = sp.x + dx + parallaxX * 10;
      const y = sp.y + dy + parallaxY * 6;
      const g = spCtx.createRadialGradient(x, y, 0, x, y, sp.r);
      g.addColorStop(0,    `rgba(255, 250, 220, ${sp.brightness})`);
      g.addColorStop(0.5,  `rgba(255, 230, 170, ${sp.brightness * 0.45})`);
      g.addColorStop(1,    `rgba(255, 210, 130, 0)`);
      spCtx.fillStyle = g;
      spCtx.beginPath();
      spCtx.arc(x, y, sp.r, 0, Math.PI * 2);
      spCtx.fill();
    }
  }

  // ---- ループ ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const t = now / 1000;

    wind   *= Math.pow(0.6, dt);
    // 無風時もごくゆっくり横に流れる
    driftX = Math.sin(t * 0.08) * 12;
    driftY = Math.cos(t * 0.06) * 6;

    drawWall();
    drawSoftShadows(t);
    drawSharpShadows(t);
    drawSpec(t);

    requestAnimationFrame(frame);
  }

  // ---- インタラクション ----
  function gust() {
    wind = Math.min(1.5, wind + 0.9);
  }
  addEventListener('touchstart', gust, { passive: true });
  addEventListener('click', gust);

  let permRequested = false;
  function enableTilt() {
    if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function' &&
        !permRequested) {
      permRequested = true;
      DeviceOrientationEvent.requestPermission().catch(() => {});
    }
  }
  addEventListener('touchend', enableTilt, { once: true });
  addEventListener('deviceorientation', (e) => {
    const g = (e.gamma || 0) / 45;
    const b = ((e.beta || 0) - 45) / 45;
    parallaxX = Math.max(-1, Math.min(1, g));
    parallaxY = Math.max(-1, Math.min(1, b));
  });

  // 初期化
  resize();
  addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
