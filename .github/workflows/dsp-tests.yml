name: DSP tests

on:
  push:
    branches: ["**"]
    paths:
      - 'ds4-native/**'
  pull_request:
    branches: ["**"]
    paths:
      - 'ds4-native/**'
  workflow_dispatch: {}

jobs:
  test:
    name: DSP unit tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make

      - name: Run DSP test suite
        working-directory: ds4-native/tests
        run: |
          chmod +x run_all.sh
          ./run_all.sh

      - name: Run DSP tests via CMake (optional)
        working-directory: ds4-native/tests
        run: |
          cmake -B build
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
