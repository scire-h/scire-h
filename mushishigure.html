<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#101112" />
<title>虫時雨 — mushishigure · 秋夜の環境音具</title>
<style>
  :root{
    --bg:    #000000;
    --line:  #26282a;   /* hairlines */
    --line2: #37393c;
    --ink:   #e3e3e3;
    --dim:   #9a9da1;
    --faint: #606367;
    --hi:    #f5f5f3;   /* the only "on" — white */
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Helvetica Neue", "Neue Haas Grotesk Text", Helvetica, Arial,
                 "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    font-weight: 300;
    font-size: 12px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  button{ font-weight: 300; }
  #app{
    max-width: 840px;
    margin: 0 auto;
    padding: 10px 20px 90px;
  }

  /* ---------- header — laid quietly over the black ---------- */
  header{
    position: absolute; top: 40px; left: 44px; right: 128px;
    display: flex; align-items: baseline; gap: 22px;
    z-index: 2;
    pointer-events: none;
  }
  header h1{
    margin: 0;
    font-size: 14px; font-weight: 400;
    letter-spacing: 0.62em;
    color: var(--ink);
  }
  header .romaji{
    font-size: 8.5px; letter-spacing: 0.42em;
    color: var(--faint);
  }
  header .desc{
    margin-left: auto;
    font-size: 8.5px; letter-spacing: 0.34em;
    color: var(--faint);
  }

  /* ---------- night scene — the work itself, full bleed ---------- */
  #scene{
    position: relative;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    background: #000;
  }
  #scene canvas{ display: block; width: 100%; height: 100%; }
  #moonBtn{
    position: absolute; top: 36px; right: 44px;
    width: 52px; height: 52px;
    padding: 0; margin: 0;
    background: none; border: 0; cursor: pointer;
    border-radius: 50%;
    z-index: 2;
  }
  #moonBtn svg{ width: 100%; height: 100%; display: block; overflow: visible; }
  #moonBtn .m-on{ opacity: 0; transition: opacity 2.4s ease; }
  #moonBtn .m-off{ opacity: 1; transition: opacity 2.4s ease; }
  #moonBtn.on .m-on{ opacity: 1; }
  #moonBtn.on .m-off{ opacity: 0; }
  #hint{
    position: absolute; left: 0; right: 0; bottom: 34px;
    text-align: center;
    font-size: 9.5px; letter-spacing: 0.6em; text-indent: 0.6em;
    color: var(--dim);
    transition: opacity 2.5s ease;
    pointer-events: none;
  }
  #hint.gone{ opacity: 0; }

  /* ---------- species rows ---------- */
  #speciesList{ margin-top: 54px; }
  .sp-row{
    border-top: 1px solid var(--line);
    padding: 17px 2px;
    transition: opacity 0.6s ease;
  }
  .sp-row:last-child{ border-bottom: 1px solid var(--line); }
  .sp-row.silent{ opacity: 0.34; }
  .sp-main{
    display: flex; align-items: center; gap: 18px;
    flex-wrap: wrap;
  }
  .sp-name{ width: 120px; flex-shrink: 0; }
  .sp-name .kanji{
    font-size: 14px; font-weight: 400;
    letter-spacing: 0.38em;
    color: var(--ink);
  }
  .sp-name .yomi{
    font-size: 8px; letter-spacing: 0.32em;
    color: var(--faint);
    margin-top: 2px;
  }
  .sp-call{
    width: 110px; flex-shrink: 0;
    font-size: 9px; letter-spacing: 0.2em;
    color: var(--dim);
  }
  /* population — hairline circles, tap n-th to set count */
  .pop{
    display: flex; gap: 9px; align-items: center;
    flex-shrink: 0;
    padding: 6px 2px;
    cursor: pointer;
  }
  .pop .p{
    width: 8px; height: 8px; border-radius: 50%;
    border: 1px solid var(--faint);
    background: transparent;
    transition: background 0.35s, border-color 0.35s;
  }
  .pop .p.on{
    background: var(--hi);
    border-color: var(--hi);
  }
  .sp-knobs{ display: flex; gap: 14px; align-items: flex-start; }
  .sp-spacer{ flex: 1; }
  /* mode toggle 野 / 拍 — words, not switches */
  .mode{
    display: flex; gap: 16px;
    flex-shrink: 0;
  }
  .mode button{
    background: none; border: 0;
    color: var(--faint);
    font: inherit; font-size: 12px;
    letter-spacing: 0.1em;
    padding: 2px 0 3px;
    cursor: pointer;
    border-bottom: 1px solid transparent;
    transition: color 0.3s, border-color 0.3s;
  }
  .mode button.on{
    color: var(--hi);
    border-bottom-color: var(--hi);
  }
  /* 16-step row */
  .sp-steps{
    display: none;
    margin-top: 14px;
    padding-left: 2px;
    gap: 9px;
    align-items: center;
  }
  .sp-row.grid .sp-steps{ display: flex; flex-wrap: wrap; }
  .step{
    width: 13px; height: 13px;
    border-radius: 50%;
    border: 1px solid var(--line2);
    background: transparent;
    cursor: pointer;
    padding: 0;
    position: relative;
    transition: background 0.15s, border-color 0.15s;
  }
  .step:nth-child(4n+1){ margin-left: 12px; }
  .step:first-child{ margin-left: 0; }
  .step.on{ background: var(--hi); border-color: var(--hi); }
  .step.soft{ border-color: var(--dim); }
  .step.soft::after{
    content:""; position:absolute; inset: 3.5px;
    border-radius: 50%;
    background: var(--dim);
  }
  .step.cur{ box-shadow: 0 0 0 2px rgba(236,236,234,0.22); }

  /* ---------- knobs ---------- */
  .knob{
    display: flex; flex-direction: column; align-items: center;
    width: 44px;
    position: relative;
  }
  .knob svg{
    width: 32px; height: 32px; display: block;
    touch-action: none;
    cursor: ns-resize;
  }
  .knob .track{ fill: none; stroke: var(--line2); stroke-width: 1; }
  .knob .fill { fill: none; stroke: var(--dim); stroke-width: 1; }
  .knob .ptr  { stroke: var(--ink); stroke-width: 1.2; stroke-linecap: butt; }
  .knob.active .fill{ stroke: var(--hi); }
  .knob .lbl{
    margin-top: 5px;
    font-size: 8.5px; letter-spacing: 0.3em; text-indent: 0.3em;
    color: var(--dim);
    white-space: nowrap;
  }
  .knob .pop-v{
    position: absolute; top: -24px; left: 50%;
    transform: translateX(-50%);
    background: var(--bg);
    border: 1px solid var(--line2);
    color: var(--hi);
    font-size: 9.5px; letter-spacing: 0.12em;
    padding: 2px 9px;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity 0.12s;
    z-index: 10;
  }
  .knob.active .pop-v{ opacity: 1; }

  /* ---------- global sections ---------- */
  #globals{
    margin-top: 58px;
    display: flex;
    gap: 56px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .g-group{
    display: flex; gap: 16px;
    align-items: flex-start;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    position: relative;
    min-width: 120px;
  }
  .g-group .g-title{
    position: absolute; top: -20px; left: 0;
    font-size: 8.5px; letter-spacing: 0.5em;
    color: var(--faint);
  }
  .g-group .knob{ width: 50px; }
  .g-group .knob svg{ width: 36px; height: 36px; }

  footer{
    margin-top: 64px;
    font-size: 8.5px; letter-spacing: 0.32em;
    color: var(--faint);
    text-align: center;
  }

  @media (max-width: 640px){
    .sp-call{ display: none; }
    .sp-name{ width: 96px; }
    .sp-name .kanji{ font-size: 13px; }
    #moonBtn{ width: 44px; height: 44px; top: 24px; right: 24px; }
    header{ top: 28px; left: 24px; right: 24px; gap: 14px; }
    header h1{ font-size: 13px; letter-spacing: 0.44em; }
    header .desc{ display: none; }
    #globals{ gap: 34px; row-gap: 44px; }
    .g-group{ gap: 8px; min-width: 0; }
    .g-group .knob{ width: 44px; }
    .sp-main{ gap: 12px; }
    .sp-knobs{ gap: 8px; }
  }
</style>
</head>
<body>
<div id="scene">
  <canvas id="night"></canvas>
  <header>
    <h1>虫時雨</h1>
    <span class="romaji">MUSHI-SHIGURE</span>
    <span class="desc">秋の夜 · 環境音具</span>
  </header>
  <button id="moonBtn" aria-label="play / stop">
    <svg viewBox="0 0 64 64">
      <circle class="m-off" cx="32" cy="32" r="19.5" fill="none"
              stroke="#a6a8aa" stroke-width="1"/>
      <circle class="m-on" cx="32" cy="32" r="20" fill="#e9e9e7"/>
    </svg>
  </button>
  <div id="hint">月に触れると、夜がはじまる</div>
</div>

<div id="app">

  <section id="speciesList"></section>

  <section id="globals">
    <div class="g-group" id="gNight">
      <span class="g-title">夜　気</span>
    </div>
    <div class="g-group" id="gDrone">
      <span class="g-title">地</span>
    </div>
    <div class="g-group" id="gBeat">
      <span class="g-title">拍</span>
    </div>
    <div class="g-group" id="gOut">
      <span class="g-title">出</span>
    </div>
  </section>

  <footer>空白鍵で開始と停止 · 「野」は自然の間合い · 「拍」は十六歩の刻み</footer>
</div>

<script>
/* =====================================================================
   虫時雨 MUSHI-SHIGURE — a quiet autumn-night field, as an instrument.

   Design notes:
   · every voice is a sine carrier with wing-stroke AM (real cricket
     stridulation is nearly pure-tone) — no noise-burst "static"
   · pitch is alive: per-individual Ornstein–Uhlenbeck drift, onset
     glide inside each ring, and a slow sub-Hz waver
   · individuals are persistent characters: own detune, own pace, own
     place in the garden, occasional long rests, call-and-response
   · 気温 (temperature) follows Dolbear's law — cold nights are slower
     and slightly flatter
   · 間 (ma) — sometimes the whole field falls silent, then returns
   · per-species 野 (free) / 拍 (16-step grid, swing + ゆらぎ) timing
   ===================================================================== */
"use strict";

const $ = s => document.querySelector(s);
const clamp = (v,a,b)=> v<a?a:v>b?b:v;
const lerp  = (a,b,t)=> a+(b-a)*t;
const rand  = (a,b)=> a+Math.random()*(b-a);
function gauss(){
  let u=0,v=0;
  while(!u) u=Math.random();
  while(!v) v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
}

/* ---------------- species definitions ---------------- */
/* interval = mean seconds between phrases per individual (at 19°C) */
const SPECIES = [
  { id:"suzu", kanji:"鈴虫", yomi:"すずむし", call:"リーン、リーン",
    hue: 42, baseFreq: 4300, interval: 7.5, drift: 0.006,
    pop: 2, vol: 0.62, pitch: 1.0, dist: 0.35 },
  { id:"matsu", kanji:"松虫", yomi:"まつむし", call:"チンチロリン",
    hue: 52, baseFreq: 5200, interval: 11, drift: 0.007,
    pop: 1, vol: 0.5, pitch: 1.0, dist: 0.45 },
  { id:"korogi", kanji:"蟋蟀", yomi:"こおろぎ", call:"コロコロリー",
    hue: 30, baseFreq: 1750, interval: 9, drift: 0.008,
    pop: 2, vol: 0.6, pitch: 1.0, dist: 0.25 },
  { id:"kane", kanji:"鉦叩", yomi:"かねたたき", call:"チン、チン、チン",
    hue: 58, baseFreq: 5900, interval: 14, drift: 0.005,
    pop: 1, vol: 0.42, pitch: 1.0, dist: 0.55 },
  { id:"umaoi", kanji:"馬追", yomi:"うまおい", call:"スイーッチョン",
    hue: 48, baseFreq: 5400, interval: 17, drift: 0.009,
    pop: 1, vol: 0.44, pitch: 1.0, dist: 0.4 },
  { id:"higu", kanji:"遠蜩", yomi:"とおひぐらし", call:"カナカナカナ…",
    hue: 20, baseFreq: 3050, interval: 34, drift: 0.006,
    pop: 0, vol: 0.5, pitch: 1.0, dist: 0.8 },
];
const MAXPOP = 4;

/* ---------------- global state ---------------- */
const S = {
  running: false,
  temp: 19,          // 気温 °C  (14–26)
  drone: 0.25,       // 地 — the continuo under the field
  droneNoise: 0.25,  // 霞 — haze of noise inside the drone
  droneWobble: 0.35, // 揺 — how far the drone is allowed to wander
  dew: 0.5,          // 露 — reverb depth
  ma: 0.5,           // 間 — hush frequency (0 = never)
  bpm: 72, swing: 0.12, yuragi: 0.5,
  masterVol: 0.8,
  step: 0, stepTime: null,
  nextHush: Infinity, hushUntil: 0,
  droneMoveAt: 0,
};
function tempRate(){ return lerp(0.5, 1.45, (S.temp-14)/12); }   // Dolbear-ish
function tempPitch(){ return lerp(0.955, 1.045, (S.temp-14)/12); }

/* ---------------- audio graph ---------------- */
let ctx=null, insectBus, fieldGain, mixBus, shaper,
    dryGain, revBus, conv, revReturn, comp, masterGain;

function initAudio(){
  if(ctx) return;
  ctx = new (window.AudioContext||window.webkitAudioContext)({ latencyHint:"playback" });

  insectBus = ctx.createGain();
  fieldGain = ctx.createGain();               // 間 (hush) rides here
  insectBus.connect(fieldGain);

  mixBus = ctx.createGain();
  fieldGain.connect(mixBus);

  // gentle analog-ish saturation
  shaper = ctx.createWaveShaper();
  const curve = new Float32Array(1024);
  for(let i=0;i<1024;i++){
    const x = i/511.5 - 1;
    curve[i] = Math.tanh(1.4*x)/Math.tanh(1.4);
  }
  shaper.curve = curve;
  shaper.oversample = "2x";
  mixBus.connect(shaper);

  // soften the very top — night air absorbs it
  const airLPF = ctx.createBiquadFilter();
  airLPF.type = "lowpass"; airLPF.frequency.value = 12500; airLPF.Q.value = 0.5;
  shaper.connect(airLPF);

  dryGain = ctx.createGain();
  airLPF.connect(dryGain);

  revBus = ctx.createGain();
  conv = ctx.createConvolver();
  conv.buffer = makeIR(3.2);
  revReturn = ctx.createGain();
  revBus.connect(conv).connect(revReturn);

  comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -26; comp.knee.value = 18;
  comp.ratio.value = 2.5; comp.attack.value = 0.02; comp.release.value = 0.45;
  dryGain.connect(comp);
  revReturn.connect(comp);

  masterGain = ctx.createGain();
  masterGain.gain.value = 0;
  comp.connect(masterGain).connect(ctx.destination);

  anaNode = ctx.createAnalyser();
  anaNode.fftSize = 1024;
  anaNode.smoothingTimeConstant = 0;
  masterGain.connect(anaNode);
  anaBuf = new Float32Array(anaNode.fftSize);

  buildDrone();
  for(const sp of SPECIES) buildIndividuals(sp);
  applyGlobals();
}

/* dark exponential-decay IR, brightness dying over the tail */
function makeIR(seconds){
  const sr = ctx.sampleRate, len = Math.floor(sr*seconds);
  const buf = ctx.createBuffer(2, len, sr);
  for(let ch=0; ch<2; ch++){
    const d = buf.getChannelData(ch);
    let lp = 0;
    for(let i=0;i<len;i++){
      const t = i/len;
      const a = Math.pow(1-t, 2.4);
      // one-pole lowpass whose coefficient darkens along the tail
      const k = lerp(0.25, 0.02, t);
      lp += k * ((Math.random()*2-1) - lp);
      d[i] = lp * a;
    }
  }
  return buf;
}

/* ---------------- 地 — the continuo drone ----------------
   Two low sines a hair apart (a slow beat, ~0.4 Hz), a soft octave
   and a slightly flat twelfth, plus 霞 — a haze of dark noise folded
   into the same body. 揺 decides how far and how restlessly the whole
   thing is allowed to wander. */
let droneGain, droneOscs = [], droneWalk = 0, droneF0 = 73.4,  // D2
    droneNoiseGain, droneNoiseLPF, noiseBuf = null;
function getNoiseBuffer(){
  if(noiseBuf) return noiseBuf;
  const sr = ctx.sampleRate, len = sr*4;
  noiseBuf = ctx.createBuffer(1, len, sr);
  const d = noiseBuf.getChannelData(0);
  let b0=0,b1=0,b2=0;
  for(let i=0;i<len;i++){ // pink-ish
    const w = Math.random()*2-1;
    b0 = 0.997*b0 + w*0.029591;
    b1 = 0.985*b1 + w*0.032534;
    b2 = 0.950*b2 + w*0.048056;
    d[i] = (b0+b1+b2+w*0.05)*3.2;
  }
  return noiseBuf;
}
function buildDrone(){
  const lpf = ctx.createBiquadFilter();
  lpf.type = "lowpass"; lpf.frequency.value = 280; lpf.Q.value = 0.3;
  droneGain = ctx.createGain(); droneGain.gain.value = 0;
  lpf.connect(droneGain).connect(mixBus);
  const wet = ctx.createGain(); wet.gain.value = 0.55;
  droneGain.connect(wet).connect(revBus);

  const parts = [
    { mul: 1.0,   g: 1.0  },
    { mul: 1.006, g: 0.9  },   // beating partner
    { mul: 2.0,   g: 0.32 },
    { mul: 2.993, g: 0.10 },   // slightly flat twelfth
  ];
  droneOscs = [];
  for(const p of parts){
    const o = ctx.createOscillator(); o.type = "sine";
    o.frequency.value = droneF0 * p.mul;
    const g = ctx.createGain(); g.gain.value = p.g;
    o.connect(g).connect(lpf);
    o.start();
    droneOscs.push({ o, mul: p.mul });
  }

  // 霞 — noise folded into the drone's own body (rides 量 as well)
  const nSrc = ctx.createBufferSource();
  nSrc.buffer = getNoiseBuffer(); nSrc.loop = true;
  droneNoiseLPF = ctx.createBiquadFilter();
  droneNoiseLPF.type = "lowpass";
  droneNoiseLPF.frequency.value = 520; droneNoiseLPF.Q.value = 0.4;
  droneNoiseGain = ctx.createGain(); droneNoiseGain.gain.value = 0;
  nSrc.connect(droneNoiseLPF).connect(droneNoiseGain).connect(lpf);
  nSrc.start();
}
function updateDrone(now){
  if(now < S.droneMoveAt) return;
  const wob = S.droneWobble;
  S.droneMoveAt = now + rand(6, 14) * lerp(1.15, 0.55, wob);
  // breathing whose depth follows 揺 — never quite the same level twice
  const depth = 0.2 + 0.55*wob;
  const breath = (1-depth) + depth*Math.pow(Math.random(), 1.3);
  droneGain.gain.setTargetAtTime(S.drone * 0.045 * breath, now, 5.0);
  // pitch wander: 揺 opens the cage, from near-still to seasick
  droneWalk = clamp(droneWalk*0.85 + gauss()*(0.0005 + 0.0034*wob),
                    -(0.002 + 0.013*wob), 0.002 + 0.013*wob);
  for(const d of droneOscs){
    d.o.frequency.setTargetAtTime(droneF0 * d.mul * (1 + droneWalk),
                                  now, lerp(4.5, 1.8, wob));
  }
  // 霞 — its own slower tide, its colour drifting with 揺
  const nb = (1-depth*0.5) + depth*0.5*Math.random();
  droneNoiseGain.gain.setTargetAtTime(S.droneNoise * 0.55 * nb, now, 4.0);
  droneNoiseLPF.frequency.setTargetAtTime(rand(320, 800 + 700*wob), now, 3.0);
}

/* ---------------- individuals ---------------- */
function buildIndividuals(sp){
  sp.inds = [];
  sp.gridIdx = 0;
  for(let i=0;i<MAXPOP;i++){
    const ind = {
      det: rand(-0.028, 0.028),          // personal tuning
      rateMul: rand(0.78, 1.3),          // personal pace
      pers: rand(0.7, 1.0),              // personal loudness
      pan: rand(-0.85, 0.85),
      distOff: rand(-0.12, 0.12),
      walk: 0,                            // OU pitch state
      actPhase: rand(0, Math.PI*2),
      next: 0, restUntil: 0,
    };
    ind.input = ctx.createGain();                 // per-call sum
    ind.lpf = ctx.createBiquadFilter();
    ind.lpf.type = "lowpass"; ind.lpf.Q.value = 0.4;
    ind.panner = ctx.createStereoPanner();
    ind.panner.pan.value = ind.pan;
    ind.dry = ctx.createGain();
    ind.wet = ctx.createGain();
    ind.input.connect(ind.lpf).connect(ind.panner);
    ind.panner.connect(ind.dry).connect(insectBus);
    ind.panner.connect(ind.wet).connect(revBus);
    sp.inds.push(ind);
  }
  applySpeciesMix(sp);
}
function indDist(sp, ind){ return clamp(sp.dist + ind.distOff, 0, 1); }
function applySpeciesMix(sp){
  if(!ctx) return;
  const now = ctx.currentTime;
  for(const ind of sp.inds){
    const d = indDist(sp, ind);
    ind.lpf.frequency.setTargetAtTime(lerp(13000, 2100, d*d), now, 0.1);
    ind.dry.gain.setTargetAtTime(sp.vol * ind.pers * lerp(1.0, 0.3, d), now, 0.1);
    ind.wet.gain.setTargetAtTime(sp.vol * ind.pers * lerp(0.15, 0.85, d) * 0.8, now, 0.1);
  }
}

/* per-ring living pitch */
function indFreq(sp, ind){
  ind.walk = clamp(ind.walk*0.88 + gauss()*sp.drift, -0.045, 0.045);
  return sp.baseFreq * sp.pitch * tempPitch() * (1 + ind.det) * (1 + ind.walk);
}

/* ---------------- voice building blocks ---------------- */
function autokill(nodes, oscs, tEnd){
  for(const o of oscs){ try{ o.stop(tEnd); }catch(_){} }
  if(oscs.length){
    oscs[0].onended = ()=>{ for(const n of nodes) try{ n.disconnect(); }catch(_){} };
  }
}

/* one ring: sine carrier + faint 2nd partial, wing-stroke AM,
   onset glide + sub-audio waver. The heart of the instrument. */
function ring(ind, t, dur, f, vel, opt={}){
  const amHz    = opt.amHz    ?? 46;
  const amDepth = opt.amDepth ?? 0.9;
  const glide   = opt.glide   ?? 0.010;   // starts sharp, settles
  const waver   = opt.waver   ?? 0.004;
  const atk     = opt.atk     ?? dur*0.32;
  const rel     = opt.rel     ?? 0.10;
  const p2      = opt.p2      ?? 0.10;

  const o1 = ctx.createOscillator(); o1.type = "sine";
  o1.frequency.setValueAtTime(f*(1+glide), t);
  o1.frequency.exponentialRampToValueAtTime(f*(1-glide*0.3), t+Math.min(dur*0.6, 0.25));

  const o2 = ctx.createOscillator(); o2.type = "sine";
  o2.frequency.setValueAtTime(f*2.02*(1+glide), t);
  o2.frequency.exponentialRampToValueAtTime(f*2.02, t+Math.min(dur*0.5, 0.2));
  const g2 = ctx.createGain(); g2.gain.value = p2;

  // slow waver on the carrier — the not-quite-steady bow arm
  const wav = ctx.createOscillator(); wav.type = "sine";
  wav.frequency.value = rand(4.5, 7.5);
  const wavG = ctx.createGain(); wavG.gain.value = f*waver;
  wav.connect(wavG).connect(o1.frequency);

  // wing-stroke AM with its own slight rate drift
  const am = ctx.createGain(); am.gain.value = 1 - amDepth*0.5;
  const lfo = ctx.createOscillator(); lfo.type = "sine";
  lfo.frequency.setValueAtTime(amHz*rand(0.94,1.06), t);
  lfo.frequency.linearRampToValueAtTime(amHz*rand(0.94,1.06), t+dur);
  const lfoG = ctx.createGain(); lfoG.gain.value = amDepth*0.5;
  lfo.connect(lfoG).connect(am.gain);

  const env = ctx.createGain(); env.gain.value = 0;
  env.gain.setValueAtTime(0, t);
  env.gain.linearRampToValueAtTime(vel, t+atk);
  env.gain.setValueAtTime(vel, Math.max(t+atk, t+dur-rel*0.6));
  env.gain.linearRampToValueAtTime(0.0001, t+dur+rel);

  o1.connect(am); o2.connect(g2).connect(am);
  am.connect(env).connect(ind.input);

  o1.start(t); o2.start(t); wav.start(t); lfo.start(t);
  autokill([g2,wavG,am,lfoG,env,wav,lfo,o2,o1], [o1,o2,wav,lfo], t+dur+rel+0.05);
}

/* short pitched tick — kanetataki / matsumushi notes */
function tick(ind, t, dur, f, vel, opt={}){
  const o = ctx.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(f*1.012, t);
  o.frequency.exponentialRampToValueAtTime(f, t+dur*0.7);
  const o2 = ctx.createOscillator(); o2.type = "sine";
  o2.frequency.value = f*(opt.pRatio ?? 2.4);
  const g2 = ctx.createGain(); g2.gain.value = opt.p2 ?? 0.14;
  const env = ctx.createGain();
  env.gain.setValueAtTime(0, t);
  env.gain.linearRampToValueAtTime(vel, t+(opt.atk ?? 0.004));
  env.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(env); o2.connect(g2).connect(env);
  env.connect(ind.input);
  o.start(t); o2.start(t);
  autokill([g2,env,o2,o], [o,o2], t+dur+0.03);
}

/* ---------------- species phrases ----------------
   phrase(sp, ind, t, vel) → seconds of sound scheduled
   unit(sp, ind, t, vel)   → one grid-triggerable element   */

const VOICES = {
  suzu: {
    phrase(sp, ind, t, vel){
      const n = 2 + (Math.random()*3|0);
      let tt = t;
      for(let i=0;i<n;i++){
        const dur = rand(0.34, 0.6);
        ring(ind, tt, dur, indFreq(sp, ind), 0.20*vel*rand(0.85,1),
             { amHz: 46, amDepth: 0.92 });
        tt += dur + rand(0.16, 0.4);
      }
      return tt - t;
    },
    unit(sp, ind, t, vel){
      ring(ind, t, rand(0.3,0.42), indFreq(sp, ind), 0.20*vel, { amHz: 46 });
    },
  },

  matsu: {
    /* チン・チロリン — one clear note, then a quick roll */
    phrase(sp, ind, t, vel){
      const f = indFreq(sp, ind);
      tick(ind, t, 0.11, f, 0.16*vel, { p2: 0.1 });
      const roll = [1.09, 0.97, 1.05, 0.93];
      const cnt = 3 + (Math.random()<0.5?1:0);
      let tt = t + rand(0.16, 0.22);
      for(let i=0;i<cnt;i++){
        tick(ind, tt, 0.09, f*roll[i]*(1+gauss()*0.004), 0.15*vel*rand(0.8,1));
        tt += rand(0.055, 0.075);
      }
      return tt + 0.1 - t;
    },
    unit(sp, ind, t, vel){
      const f = indFreq(sp, ind);
      tick(ind, t, 0.1, f, 0.16*vel);
      tick(ind, t+0.06, 0.09, f*1.08, 0.13*vel);
      tick(ind, t+0.12, 0.09, f*0.96, 0.13*vel);
    },
  },

  korogi: {
    /* コロコロリー — a slowing, breathing pulse train */
    phrase(sp, ind, t, vel){
      const f0 = indFreq(sp, ind);
      const n = 7 + (Math.random()*7|0);
      let iv = rand(0.042, 0.052), tt = t, f = f0;
      for(let i=0;i<n;i++){
        const bell = Math.sin(Math.PI * (i+0.5)/n);       // swell then fade
        ring(ind, tt, 0.034, f, 0.17*vel*(0.35+0.65*bell),
             { amHz: 0.0001, amDepth: 0, atk: 0.008, rel: 0.02, glide: 0.004, p2: 0.06 });
        f *= 1 - 0.0022 - Math.random()*0.002;            // sags as it tires
        iv *= 1.018 + Math.random()*0.012;
        tt += iv;
      }
      return tt - t;
    },
    unit(sp, ind, t, vel){
      const f = indFreq(sp, ind);
      for(let i=0;i<3;i++)
        ring(ind, t+i*0.05, 0.034, f*(1-0.002*i), 0.16*vel*(1-0.15*i),
             { amHz:0.0001, amDepth:0, atk:0.008, rel:0.02, p2:0.06 });
    },
  },

  kane: {
    /* チン、チン、チン — patient little bell strikes */
    phrase(sp, ind, t, vel){
      const n = 5 + (Math.random()*9|0);
      const iv = rand(0.15, 0.21);
      let tt = t;
      for(let i=0;i<n;i++){
        tick(ind, tt, 0.055, indFreq(sp, ind), 0.13*vel*rand(0.8,1),
             { pRatio: 1.63, p2: 0.2, atk: 0.002 });
        tt += iv * rand(0.92, 1.1);
      }
      return tt - t;
    },
    unit(sp, ind, t, vel){
      tick(ind, t, 0.055, indFreq(sp, ind), 0.14*vel, { pRatio: 1.63, p2: 0.2, atk: 0.002 });
    },
  },

  umaoi: {
    /* スイーッ…チョン */
    phrase(sp, ind, t, vel){
      const f = indFreq(sp, ind);
      const dur = rand(0.4, 0.6);
      // rising buzz — square-wave wing AM
      const o = ctx.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(f*0.86, t);
      o.frequency.exponentialRampToValueAtTime(f*1.04, t+dur);
      const am = ctx.createGain(); am.gain.value = 0.5;
      const lfo = ctx.createOscillator(); lfo.type = "square";
      lfo.frequency.setValueAtTime(64, t);
      lfo.frequency.linearRampToValueAtTime(96, t+dur);
      const lfoG = ctx.createGain(); lfoG.gain.value = 0.5;
      lfo.connect(lfoG).connect(am.gain);
      const env = ctx.createGain();
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(0.11*vel, t+dur*0.7);
      env.gain.linearRampToValueAtTime(0.13*vel, t+dur);
      env.gain.linearRampToValueAtTime(0.0001, t+dur+0.02);
      o.connect(am).connect(env).connect(ind.input);
      o.start(t);
      lfo.start(t);
      autokill([am,lfoG,env,lfo,o],[o,lfo], t+dur+0.05);
      // チョン
      tick(ind, t+dur+rand(0.02,0.06), 0.07, f*0.74, 0.19*vel, { p2: 0.18, atk: 0.003 });
      return dur + 0.15;
    },
    unit(sp, ind, t, vel){
      tick(ind, t, 0.07, indFreq(sp, ind)*0.74, 0.18*vel, { p2: 0.18, atk: 0.003 });
    },
  },

  higu: {
    /* カナカナカナ… — far away, mostly reverb */
    phrase(sp, ind, t, vel){
      const f = indFreq(sp, ind);
      const dur = rand(2.0, 3.4);
      const o = ctx.createOscillator(); o.type = "sine";
      o.frequency.setValueAtTime(f, t);
      o.frequency.exponentialRampToValueAtTime(f*0.8, t+dur);
      const o2 = ctx.createOscillator(); o2.type = "sine";
      o2.frequency.setValueAtTime(f*1.98, t);
      o2.frequency.exponentialRampToValueAtTime(f*1.98*0.8, t+dur);
      const g2 = ctx.createGain(); g2.gain.value = 0.12;
      const am = ctx.createGain(); am.gain.value = 0.5;
      const lfo = ctx.createOscillator(); lfo.type = "sine";
      lfo.frequency.setValueAtTime(rand(8,9.5), t);
      lfo.frequency.linearRampToValueAtTime(rand(6.5,7.5), t+dur);
      const lfoG = ctx.createGain(); lfoG.gain.value = 0.5;
      lfo.connect(lfoG).connect(am.gain);
      const env = ctx.createGain();
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(0.12*vel, t+0.6);
      env.gain.setValueAtTime(0.12*vel, t+dur-0.9);
      env.gain.linearRampToValueAtTime(0.0001, t+dur);
      o.connect(am); o2.connect(g2).connect(am);
      am.connect(env).connect(ind.input);
      o.start(t); o2.start(t); lfo.start(t);
      autokill([g2,am,lfoG,env,o,o2,lfo],[o,o2,lfo], t+dur+0.05);
      return dur;
    },
    unit(sp, ind, t, vel){
      ring(ind, t, 0.35, indFreq(sp, ind), 0.11*vel, { amHz: 8, amDepth: 1 });
    },
  },
};

/* ---------------- firing & scheduling ---------------- */
function firePhrase(sp, ind, t, vel, isUnit){
  const v = VOICES[sp.id];
  let dur = 0.3;
  if(isUnit) v.unit(sp, ind, t, vel);
  else dur = v.phrase(sp, ind, t, vel);
  addGlow(sp, ind, t, vel, dur);
  return dur;
}

function scheduleNext(sp, ind, tEnd){
  ind.actPhase += rand(0.25, 0.6);
  const act = 0.62 + 0.38*Math.sin(ind.actPhase);          // slow personal tide
  let iv = sp.interval * ind.rateMul / tempRate() / act;
  iv *= 0.45 + Math.pow(Math.random(), 1.6) * 1.7;          // skewed jitter
  if(Math.random() < 0.06 * (0.4 + S.ma)){                  // a long rest
    ind.restUntil = tEnd + rand(16, 50);
  }
  ind.next = tEnd + Math.max(0.5, iv);
}

/* call-and-response inside a species */
function kakeai(sp, caller, t, dur){
  if(sp.pop < 2) return;
  for(let i=0;i<sp.pop;i++){
    const other = sp.inds[i];
    if(other === caller) continue;
    if(Math.random() < 0.4 && other.restUntil < t){
      const reply = t + dur + rand(0.3, 1.8);
      if(other.next > reply) other.next = reply;
    }
  }
}

function anyGrid(){ return SPECIES.some(sp => sp.mode === "grid" && sp.pop > 0); }

let schedTimer = null;
function tickSched(){
  if(!S.running) return;
  const now = ctx.currentTime;
  const horizon = now + 0.35;

  for(const sp of SPECIES){
    if(sp.mode === "grid") continue;
    for(let i=0;i<sp.pop;i++){
      const ind = sp.inds[i];
      if(ind.next === 0) ind.next = now + rand(0.3, sp.interval*0.9);
      while(ind.next < horizon){
        if(ind.restUntil > ind.next){
          ind.next = ind.restUntil + rand(0, 2);
          continue;
        }
        const t = Math.max(ind.next, now + 0.02);
        const dur = firePhrase(sp, ind, t, 1, false);
        kakeai(sp, ind, t, dur);
        scheduleNext(sp, ind, t + dur);
      }
    }
  }

  if(anyGrid()){
    if(S.stepTime === null){ S.stepTime = now + 0.06; S.step = 0; }
    const spb = 60 / S.bpm / 4;
    while(S.stepTime < horizon){
      const idx = S.step;
      for(const sp of SPECIES){
        if(sp.mode !== "grid" || sp.pop === 0) continue;
        const v = sp.steps[idx];
        if(v){
          let t = S.stepTime;
          if(idx % 2 === 1) t += S.swing * spb * 0.66;
          t += gauss() * S.yuragi * 0.028;
          t = Math.max(t, now + 0.01);
          sp.gridIdx = (sp.gridIdx + 1) % Math.max(1, sp.pop);
          firePhrase(sp, sp.inds[sp.gridIdx], t, v === 2 ? 0.45 : 1, true);
        }
      }
      stepVisual(idx, S.stepTime);
      S.step = (S.step + 1) % 16;
      S.stepTime += spb;
    }
  } else {
    S.stepTime = null;
  }

  updateDrone(now);
  updateHush(now);
  schedTimer = setTimeout(tickSched, 60);
}

/* ---------------- 間 — the field's silence ---------------- */
function armHush(now){
  S.nextHush = S.ma > 0.02
    ? now + lerp(220, 55, S.ma) * rand(0.7, 1.5)
    : Infinity;
}
function scheduleHush(t, hold){
  fieldGain.gain.cancelScheduledValues(t);
  fieldGain.gain.setTargetAtTime(0.04, t, 0.5);
  const back = t + 1.5 + hold;
  fieldGain.gain.setTargetAtTime(1.0, back, 1.8);
  S.hushUntil = back + 4;
  // individuals wake staggered, not all at once
  for(const sp of SPECIES) for(let i=0;i<sp.pop;i++){
    const ind = sp.inds[i];
    if(ind.next < back) ind.next = back + rand(0.5, 6);
  }
  armHush(back);
}
function updateHush(now){
  if(S.ma <= 0.02){ S.nextHush = Infinity; return; }
  if(S.nextHush === Infinity) armHush(now);
  if(now >= S.nextHush) scheduleHush(now, rand(3, 9));
}

/* ---------------- transport ---------------- */
async function startNight(){
  initAudio();
  if(ctx.state === "suspended") await ctx.resume();
  S.running = true;
  const now = ctx.currentTime;
  masterGain.gain.cancelScheduledValues(now);
  masterGain.gain.setTargetAtTime(S.masterVol*0.7, now, 1.2);
  fieldGain.gain.setValueAtTime(1, now);
  for(const sp of SPECIES) for(const ind of sp.inds){
    ind.next = 0; ind.restUntil = 0;
  }
  S.stepTime = null;
  S.droneMoveAt = 0;
  armHush(now + 20);
  tickSched();
  $("#moonBtn").classList.add("on");
  $("#hint").classList.add("gone");
}
function stopNight(){
  S.running = false;
  clearTimeout(schedTimer);
  if(ctx){
    const now = ctx.currentTime;
    masterGain.gain.setTargetAtTime(0, now, 0.7);
  }
  $("#moonBtn").classList.remove("on");
}
$("#moonBtn").addEventListener("click", ()=>{ S.running ? stopNight() : startNight(); });
window.addEventListener("keydown", e=>{
  if(e.code === "Space" && !e.repeat){
    e.preventDefault();
    S.running ? stopNight() : startNight();
  }
});

/* ---------------- knob widget ---------------- */
function makeKnob({label, min, max, value, fmt, onInput, def}){
  const el = document.createElement("div");
  el.className = "knob";
  el.innerHTML = `
    <div class="pop-v"></div>
    <svg viewBox="0 0 40 40">
      <path class="track" d=""/>
      <path class="fill" d=""/>
      <line class="ptr" x1="20" y1="20" x2="20" y2="6"/>
    </svg>
    <div class="lbl">${label}</div>`;
  const svg = el.querySelector("svg");
  const track = el.querySelector(".track");
  const fill = el.querySelector(".fill");
  const ptr = el.querySelector(".ptr");
  const popV = el.querySelector(".pop-v");
  const A0 = -135, A1 = 135;
  function arc(a0, a1){
    const r = 16, cx = 20, cy = 20;
    const p = a => [cx + r*Math.sin(a*Math.PI/180), cy - r*Math.cos(a*Math.PI/180)];
    const [x0,y0] = p(a0), [x1,y1] = p(a1);
    const large = (a1-a0) > 180 ? 1 : 0;
    return `M ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1}`;
  }
  track.setAttribute("d", arc(A0, A1));
  let v = value;
  function render(){
    const t = (v - min)/(max - min);
    const a = lerp(A0, A1, t);
    fill.setAttribute("d", t > 0.004 ? arc(A0, a) : "");
    const rad = a*Math.PI/180;
    ptr.setAttribute("x2", 20 + 11*Math.sin(rad));
    ptr.setAttribute("y2", 20 - 11*Math.cos(rad));
    popV.textContent = fmt ? fmt(v) : v.toFixed(2);
  }
  render();
  let dragY = null, dragV = 0;
  svg.addEventListener("pointerdown", e=>{
    e.preventDefault();
    svg.setPointerCapture(e.pointerId);
    dragY = e.clientY; dragV = v;
    el.classList.add("active");
  });
  svg.addEventListener("pointermove", e=>{
    if(dragY === null) return;
    const dy = dragY - e.clientY;
    v = clamp(dragV + dy/130*(max-min), min, max);
    render(); onInput(v);
  });
  const end = e=>{ dragY = null; el.classList.remove("active"); };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);
  svg.addEventListener("dblclick", ()=>{
    if(def !== undefined){ v = def; render(); onInput(v); }
  });
  svg.addEventListener("wheel", e=>{
    e.preventDefault();
    v = clamp(v - Math.sign(e.deltaY)*(max-min)/60, min, max);
    render(); onInput(v);
    el.classList.add("active");
    clearTimeout(el._wt);
    el._wt = setTimeout(()=> el.classList.remove("active"), 700);
  }, {passive:false});
  el._set = nv => { v = clamp(nv, min, max); render(); };
  return el;
}

/* ---------------- species UI ---------------- */
function buildSpeciesUI(){
  const root = $("#speciesList");
  root.innerHTML = "";
  for(const sp of SPECIES){
    sp.mode = sp.mode || "free";
    sp.steps = sp.steps || defaultSteps(sp);
    const row = document.createElement("div");
    row.className = "sp-row" + (sp.pop === 0 ? " silent" : "") + (sp.mode === "grid" ? " grid" : "");
    row.innerHTML = `
      <div class="sp-main">
        <div class="sp-name">
          <div class="kanji">${sp.kanji}</div>
          <div class="yomi">${sp.yomi}</div>
        </div>
        <div class="sp-call">${sp.call}</div>
        <div class="pop" title="数 — how many are singing"></div>
        <div class="sp-spacer"></div>
        <div class="sp-knobs"></div>
        <div class="mode">
          <button data-m="free" class="${sp.mode==='free'?'on':''}">野</button>
          <button data-m="grid" class="${sp.mode==='grid'?'on':''}">拍</button>
        </div>
      </div>
      <div class="sp-steps"></div>`;

    // population dots
    const popEl = row.querySelector(".pop");
    const dots = [];
    for(let i=0;i<MAXPOP;i++){
      const d = document.createElement("div");
      d.className = "p" + (i < sp.pop ? " on" : "");
      d.addEventListener("click", ()=>{
        const target = (sp.pop === i+1) ? i : i+1;
        setPop(sp, target, row, dots);
      });
      popEl.appendChild(d); dots.push(d);
    }

    // knobs 声 / 遠 / 音
    const kn = row.querySelector(".sp-knobs");
    kn.appendChild(makeKnob({
      label:"声", min:0.88, max:1.14, value:sp.pitch, def:1,
      fmt:v=> (sp.baseFreq*v).toFixed(0)+" Hz",
      onInput:v=>{ sp.pitch = v; saveSoon(); },
    }));
    kn.appendChild(makeKnob({
      label:"遠", min:0, max:1, value:sp.dist, def:sp.dist,
      fmt:v=> v<0.33?"すぐそこ":v<0.66?"庭のさき":"野のむこう",
      onInput:v=>{ sp.dist = v; applySpeciesMix(sp); saveSoon(); },
    }));
    kn.appendChild(makeKnob({
      label:"音", min:0, max:1, value:sp.vol, def:0.6,
      fmt:v=> Math.round(v*100)+"",
      onInput:v=>{ sp.vol = v; applySpeciesMix(sp); saveSoon(); },
    }));

    // mode toggle
    row.querySelectorAll(".mode button").forEach(b=>{
      b.addEventListener("click", ()=>{
        sp.mode = b.dataset.m;
        row.querySelectorAll(".mode button").forEach(x=> x.classList.toggle("on", x===b));
        row.classList.toggle("grid", sp.mode === "grid");
        if(sp.mode === "free" && ctx)
          for(let i=0;i<sp.pop;i++) sp.inds[i].next = ctx.currentTime + rand(0.3, 3);
        saveSoon();
      });
    });

    // steps: off → on → soft → off
    const stepsEl = row.querySelector(".sp-steps");
    sp.stepEls = [];
    for(let i=0;i<16;i++){
      const b = document.createElement("button");
      b.className = "step";
      paintStep(b, sp.steps[i]);
      b.addEventListener("click", ()=>{
        sp.steps[i] = (sp.steps[i] + 1) % 3;
        paintStep(b, sp.steps[i]);
        saveSoon();
      });
      stepsEl.appendChild(b);
      sp.stepEls.push(b);
    }
    root.appendChild(row);
  }
}
function paintStep(el, v){
  el.classList.toggle("on", v === 1);
  el.classList.toggle("soft", v === 2);
}
function setPop(sp, n, row, dots){
  const prev = sp.pop;
  sp.pop = clamp(n, 0, MAXPOP);
  dots.forEach((d,i)=> d.classList.toggle("on", i < sp.pop));
  row.classList.toggle("silent", sp.pop === 0);
  if(ctx && S.running){
    for(let i=prev; i<sp.pop; i++){
      sp.inds[i].next = ctx.currentTime + rand(0.4, 3.5);
      sp.inds[i].restUntil = 0;
    }
  }
  saveSoon();
}
function defaultSteps(sp){
  const s = new Array(16).fill(0);
  if(sp.id === "suzu"){ s[0]=1; s[8]=1; }
  if(sp.id === "korogi"){ s[4]=1; s[12]=2; }
  if(sp.id === "kane"){ s[2]=2; s[6]=2; s[10]=2; s[14]=2; }
  return s;
}
function stepVisual(idx, when){
  const ms = Math.max(0, (when - ctx.currentTime)*1000);
  setTimeout(()=>{
    for(const sp of SPECIES){
      if(!sp.stepEls) continue;
      sp.stepEls.forEach((el,i)=> el.classList.toggle("cur", sp.mode==="grid" && i===idx));
    }
  }, ms);
}

    label:"量", min:0, max:1, value:S.drone, def:0.25,

  gB.appendChild(makeKnob({
    label:"速さ", min:40, max:140, value:S.bpm, def:72,

  gB.appendChild(makeKnob({
    label:"うねり", min:0, max:0.6, value:S.swing, def:0.12,

    onInput:v=>{ S.swing = v; saveSoon(); },
  }));
  gB.appendChild(makeKnob({
    label:"ゆらぎ", min:0, max:1, value:S.yuragi, def:0.5,
    fmt:v=> Math.round(v*100)+"",
    onInput:v=>{ S.yuragi = v; saveSoon(); },
  }));
  gO.appendChild(makeKnob({
    label:"音量", min:0, max:1, value:S.masterVol, def:0.8,
    fmt:v=> Math.round(v*100)+"",
    onInput:v=>{
      S.masterVol = v;
      if(ctx && S.running)
        masterGain.gain.setTargetAtTime(v*0.7, ctx.currentTime, 0.15);
      saveSoon();
    },
  }));
}
function applyGlobals(){
  if(!ctx) return;
  const now = ctx.currentTime;
  revReturn.gain.setTargetAtTime(S.dew * 1.1, now, 0.2);
  dryGain.gain.setTargetAtTime(1 - S.dew*0.25, now, 0.2);
}

/* ---------------- persistence ---------------- */
const LS_KEY = "mushishigure-v1";
let saveTimer = null;
function saveSoon(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{
      const data = {
        S: { temp:S.temp, drone:S.drone, droneNoise:S.droneNoise,
             droneWobble:S.droneWobble, dew:S.dew, ma:S.ma,
             bpm:S.bpm, swing:S.swing, yuragi:S.yuragi, masterVol:S.masterVol },
        sp: SPECIES.map(sp=>({ pop:sp.pop, vol:sp.vol, pitch:sp.pitch,
                               dist:sp.dist, mode:sp.mode, steps:sp.steps })),
      };
      localStorage.setItem(LS_KEY, JSON.stringify(data));
    }catch(_){}
  }, 400);
}
function loadSaved(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const data = JSON.parse(raw);
    Object.assign(S, data.S || {});
    (data.sp || []).forEach((d,i)=>{
      if(!SPECIES[i]) return;
      Object.assign(SPECIES[i], d);
    });
  }catch(_){}
}

/* ---------------- the night canvas ----------------
   Weightless space. A nameless ether drifts through it like smoke;
   the space itself slowly inflates; whatever the sound throws in has
   nowhere to go — entropy only grows — so grains cling where they
   meet, and strange bodies condense here and there, tumbling slowly.
   All of it strictly in time with the sound. */
const cv = $("#night");
const cx2 = cv.getContext("2d");
let anaNode = null, anaBuf = null;
let W=0, H=0, DPR=1;

/* world: centered at the origin, roughly a sphere of radius ~2 */
const CAM = 2.6;                  // camera distance
let free = [];                    // loose grains
let clusters = [];                // condensed bodies
let wisps = [];                   // the ether
let loci = [];                    // where voices sounded recently
let burst = 0, ampEnv = 0, lastTs = 0, rotY = 0;
let blobSprite = null;

function resizeCanvas(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cx2.setTransform(DPR,0,0,DPR,0,0);
  if(!blobSprite){
    blobSprite = document.createElement("canvas");
    blobSprite.width = blobSprite.height = 256;
    const bc = blobSprite.getContext("2d");
    const rg = bc.createRadialGradient(128,128,0, 128,128,128);
    rg.addColorStop(0,   "rgba(235,236,237,0.9)");
    rg.addColorStop(0.45,"rgba(235,236,237,0.28)");
    rg.addColorStop(1,   "rgba(235,236,237,0)");
    bc.fillStyle = rg;
    bc.fillRect(0,0,256,256);
  }
  if(wisps.length === 0){
    for(let i=0;i<34;i++){
      wisps.push({
        x: rand(-1.5,1.5), y: rand(-1.1,1.1), z: rand(-1.5,1.5),
        r: rand(0.28, 0.72), ph: rand(0, Math.PI*2), sp: rand(0.4, 1.1),
      });
    }
  }
}
window.addEventListener("resize", resizeCanvas);

/* the ether current — a slow, smoky pseudo-curl field */
function flowX(x,y,z,t){ return Math.sin(1.7*y + t*0.21) + Math.cos(2.3*z - t*0.17); }
function flowY(x,y,z,t){ return Math.sin(1.9*z + t*0.16) + Math.cos(2.1*x + t*0.19); }
function flowZ(x,y,z,t){ return Math.sin(1.6*x - t*0.18) + Math.cos(2.4*y + t*0.15); }

/* projection with a slow drift of the vantage — parallax, no ground */
function project(x, y, z){
  const c = Math.cos(rotY), s = Math.sin(rotY);
  const xr = x*c - z*s, zr = x*s + z*c;
  const dz = Math.max(0.35, zr + CAM);
  const k = 0.62*Math.min(W,H)/dz;
  return [ W*0.5 + xr*k, H*0.5 + y*k, k, dz ];
}

/* a call marks a place in space and adds pressure */
function addGlow(sp, ind, when, vel, dur){
  const delay = ctx ? Math.max(0, (when - ctx.currentTime)*1000) : 0;
  setTimeout(()=>{
    burst = Math.min(2.2, burst + 0.5*Math.min(1, vel));
    const d = indDist(sp, ind);
    loci.push({
      x: ind.pan*1.1,
      y: rand(-0.7, 0.7),
      z: (d*2 - 1)*1.1,
      until: performance.now() + Math.max(400, Math.min(dur, 3)*1000),
    });
    if(loci.length > 24) loci.shift();
  }, delay);
}

function spawnFree(){
  if(free.length >= 1200) return;
  let x, y, z;
  const active = loci.length && Math.random() < 0.45;
  if(active){
    const l = loci[(Math.random()*loci.length)|0];
    x = l.x + gauss()*0.14; y = l.y + gauss()*0.14; z = l.z + gauss()*0.14;
  } else {
    const rr = Math.pow(Math.random(), 0.6)*1.5;
    const th = rand(0, Math.PI*2), ph = Math.acos(rand(-1,1));
    x = rr*Math.sin(ph)*Math.cos(th);
    y = rr*Math.cos(ph)*0.8;
    z = rr*Math.sin(ph)*Math.sin(th);
  }
  free.push({
    x, y, z,
    vx: gauss()*0.05, vy: gauss()*0.05, vz: gauss()*0.05,
    c: 208 + Math.random()*40 | 0,
  });
}

/* two loose grains meet → a new body is born */
function condense(a, b){
  const cxp = (a.x+b.x)/2, cyp = (a.y+b.y)/2, czp = (a.z+b.z)/2;
  const axis = (()=>{ // random rotation axis, normalized
    let x=gauss(), y=gauss(), z=gauss();
    const n = Math.hypot(x,y,z)||1; return {x:x/n, y:y/n, z:z/n};
  })();
  clusters.push({
    x: cxp, y: cyp, z: czp,
    vx: (a.vx+b.vx)/2, vy: (a.vy+b.vy)/2, vz: (a.vz+b.vz)/2,
    axis, ang: 0, w: gauss()*0.5,
    m: 2, r: 0.03,
    members: [
      { x: a.x-cxp, y: a.y-cyp, z: a.z-czp, c: a.c },
      { x: b.x-cxp, y: b.y-cyp, z: b.z-czp, c: b.c },
    ],
  });
}

/* Rodrigues rotation of member offsets */
function rotOff(o, axis, ang){
  const c = Math.cos(ang), s = Math.sin(ang), t = 1-c;
  const kx = axis.x, ky = axis.y, kz = axis.z;
  const dot = kx*o.x + ky*o.y + kz*o.z;
  return [
    o.x*c + (ky*o.z - kz*o.y)*s + kx*dot*t,
    o.y*c + (kz*o.x - kx*o.z)*s + ky*dot*t,
    o.z*c + (kx*o.y - ky*o.x)*s + kz*dot*t,
  ];
}

function attach(cl, p){
  // momentum
  cl.vx = (cl.vx*cl.m + p.vx)/(cl.m+1);
  cl.vy = (cl.vy*cl.m + p.vy)/(cl.m+1);
  cl.vz = (cl.vz*cl.m + p.vz)/(cl.m+1);
  cl.m++;
  if(cl.members.length < 240){
    // world offset → body frame (inverse rotation)
    const [ox, oy, oz] = rotOff({x:p.x-cl.x, y:p.y-cl.y, z:p.z-cl.z},
                                cl.axis, -cl.ang);
    cl.members.push({ x: ox, y: oy, z: oz, c: p.c });
  }
  cl.r = 0.012*Math.pow(cl.m, 0.4) + 0.012;
}

function absorb(big, small){
  big.vx = (big.vx*big.m + small.vx*small.m)/(big.m+small.m);
  big.vy = (big.vy*big.m + small.vy*small.m)/(big.m+small.m);
  big.vz = (big.vz*big.m + small.vz*small.m)/(big.m+small.m);
  for(const mo of small.members){
    if(big.members.length >= 240) break;
    const [wx, wy, wz] = rotOff(mo, small.axis, small.ang);
    const [ox, oy, oz] = rotOff({x: small.x+wx-big.x, y: small.y+wy-big.y,
                                 z: small.z+wz-big.z}, big.axis, -big.ang);
    big.members.push({ x: ox, y: oy, z: oz, c: mo.c });
  }
  big.m += small.m;
  big.r = 0.012*Math.pow(big.m, 0.4) + 0.012;
}

function draw(ts){
  requestAnimationFrame(draw);
  const dt = clamp((ts - lastTs)/1000 || 0.016, 0.001, 0.05);
  lastTs = ts;
  const nowMs = performance.now();
  const t = nowMs*0.001;

  // how much the air is moving, with a slow-release envelope
  let amp = 0;
  if(anaNode){
    anaNode.getFloatTimeDomainData(anaBuf);
    for(let i=0;i<anaBuf.length;i+=2){
      const v = anaBuf[i]; if(v>amp) amp=v; else if(-v>amp) amp=-v;
    }
  }
  ampEnv = Math.max(amp, ampEnv*Math.pow(0.3, dt));

  rotY += dt*0.02;                                  // the vantage drifts
  const HBL = 0.006 + ampEnv*0.05;                  // inflation, sound-paced
  const stir = 0.05 + ampEnv*1.1;                   // ether turbulence

  // matter arrives only while the waveform moves
  burst *= Math.pow(0.25, dt);
  loci = loci.filter(l => l.until > nowMs);
  if(amp > 0.004){
    let k = Math.min(12, Math.round(amp * 220 * (0.55 + burst)));
    while(k-- > 0) spawnFree();
  }

  // ---- free grains: drift with the ether, inflate, cling ----
  for(let i=free.length-1; i>=0; i--){
    const g = free[i];
    g.vx += (flowX(g.x,g.y,g.z,t)*stir - g.vx)*0.6*dt;
    g.vy += (flowY(g.x,g.y,g.z,t)*stir - g.vy)*0.6*dt;
    g.vz += (flowZ(g.x,g.y,g.z,t)*stir - g.vz)*0.6*dt;
    // gentle pull of the nearest bodies
    for(const cl of clusters){
      const dx = cl.x-g.x, dy = cl.y-g.y, dz = cl.z-g.z;
      const d2 = dx*dx+dy*dy+dz*dz;
      if(d2 < 0.2){
        const f = 0.06*Math.min(1, cl.m/60)/Math.max(d2, 0.004)*dt;
        g.vx += dx*f; g.vy += dy*f; g.vz += dz*f;
      }
    }
    g.x += g.vx*dt + g.x*HBL*dt;
    g.y += g.vy*dt + g.y*HBL*dt;
    g.z += g.vz*dt + g.z*HBL*dt;
    if(g.x*g.x + g.y*g.y + g.z*g.z > 5.3){          // dispersed, gone
      free[i] = free[free.length-1]; free.pop(); continue;
    }
    // cling to a body it touches
    for(const cl of clusters){
      const dx = cl.x-g.x, dy = cl.y-g.y, dz = cl.z-g.z;
      const rr = cl.r + 0.02;
      if(dx*dx+dy*dy+dz*dz < rr*rr){
        attach(cl, g);
        free[i] = free[free.length-1]; free.pop();
        break;
      }
    }
  }

  // ---- free–free encounters: spatial hash, then condensation ----
  if(free.length > 1 && clusters.length < 64){
    const cell = 0.055, map = new Map();
    for(let i=0;i<free.length;i++){
      const g = free[i];
      const key = ((g.x/cell)|0)*73856093 ^ ((g.y/cell)|0)*19349663 ^ ((g.z/cell)|0)*83492791;
      let arr = map.get(key);
      if(!arr){ arr = []; map.set(key, arr); }
      if(arr.length < 6) arr.push(i);
    }
    const dead = new Set();
    for(const arr of map.values()){
      for(let a=0;a<arr.length;a++) for(let b=a+1;b<arr.length;b++){
        const i = arr[a], j = arr[b];
        if(dead.has(i) || dead.has(j)) continue;
        const g = free[i], h = free[j];
        const dx = g.x-h.x, dy = g.y-h.y, dz = g.z-h.z;
        if(dx*dx+dy*dy+dz*dz < 0.00035){
          condense(g, h); dead.add(i); dead.add(j);
        }
      }
    }
    if(dead.size){
      free = free.filter((_,i)=> !dead.has(i));
    }
  }

  // ---- bodies: tumble, drift, inflate, merge ----
  for(let i=clusters.length-1; i>=0; i--){
    const cl = clusters[i];
    const soft = 1/(1 + cl.m*0.06);                 // heavy ones barely stir
    cl.vx += (flowX(cl.x,cl.y,cl.z,t)*stir*soft - cl.vx)*0.35*dt;
    cl.vy += (flowY(cl.x,cl.y,cl.z,t)*stir*soft - cl.vy)*0.35*dt;
    cl.vz += (flowZ(cl.x,cl.y,cl.z,t)*stir*soft - cl.vz)*0.35*dt;
    cl.x += cl.vx*dt + cl.x*HBL*dt;
    cl.y += cl.vy*dt + cl.y*HBL*dt;
    cl.z += cl.vz*dt + cl.z*HBL*dt;
    cl.ang += cl.w*dt*(0.5 + ampEnv*1.5);           // tumbling in time
    if(cl.x*cl.x + cl.y*cl.y + cl.z*cl.z > 6.8){
      clusters[i] = clusters[clusters.length-1]; clusters.pop(); continue;
    }
  }
  for(let i=clusters.length-1; i>=0; i--){
    for(let j=i-1; j>=0; j--){
      const a = clusters[i], b = clusters[j];
      const dx = a.x-b.x, dy = a.y-b.y, dz = a.z-b.z;
      const rr = (a.r + b.r)*0.6;
      if(dx*dx+dy*dy+dz*dz < rr*rr){
        const big = a.m >= b.m ? b : a;   // survivor is at index j or i
        if(a.m >= b.m){ absorb(a, b); clusters.splice(j,1); i--; }
        else          { absorb(b, a); clusters.splice(i,1); }
        break;
      }
    }
  }

  // ---- render ----
  cx2.fillStyle = "#000";
  cx2.fillRect(0,0,W,H);

  // the ether — smoke, thick with 地, stirred by the sound
  const etherA = 0.045*(0.35 + S.drone*0.65)*(0.6 + ampEnv*1.8);
  cx2.globalCompositeOperation = "lighter";
  for(const wp of wisps){
    wp.x += flowX(wp.x,wp.y,wp.z,t)*stir*0.12*wp.sp*dt + wp.x*HBL*dt*0.5;
    wp.y += flowY(wp.x,wp.y,wp.z,t)*stir*0.12*wp.sp*dt + wp.y*HBL*dt*0.5;
    wp.z += flowZ(wp.x,wp.y,wp.z,t)*stir*0.12*wp.sp*dt + wp.z*HBL*dt*0.5;
    if(wp.x*wp.x + wp.y*wp.y + wp.z*wp.z > 4.6){
      wp.x = rand(-0.6,0.6); wp.y = rand(-0.5,0.5); wp.z = rand(-0.6,0.6);
    }
    const [px, py, k, dz] = project(wp.x, wp.y, wp.z);
    const R = wp.r*(1 + 0.18*Math.sin(t*0.5*wp.sp + wp.ph))*k;
    if(R < 4) continue;
    cx2.globalAlpha = etherA*clamp(2.2/dz, 0.3, 1);
    cx2.drawImage(blobSprite, px-R, py-R, R*2, R*2);
  }
  cx2.globalAlpha = 1;
  cx2.globalCompositeOperation = "source-over";

  // condensed bodies — strange forms, slowly tumbling
  for(const cl of clusters){
    // one rotation matrix per body per frame
    const ca = Math.cos(cl.ang), sa = Math.sin(cl.ang), ta = 1-ca;
    const kx = cl.axis.x, ky = cl.axis.y, kz = cl.axis.z;
    const m00 = ca+kx*kx*ta, m01 = kx*ky*ta-kz*sa, m02 = kx*kz*ta+ky*sa;
    const m10 = ky*kx*ta+kz*sa, m11 = ca+ky*ky*ta, m12 = ky*kz*ta-kx*sa;
    const m20 = kz*kx*ta-ky*sa, m21 = kz*ky*ta+kx*sa, m22 = ca+kz*kz*ta;
    for(const mo of cl.members){
      const wx = m00*mo.x + m01*mo.y + m02*mo.z;
      const wy = m10*mo.x + m11*mo.y + m12*mo.z;
      const wz = m20*mo.x + m21*mo.y + m22*mo.z;
      const [px, py, k, dz] = project(cl.x+wx, cl.y+wy, cl.z+wz);
      const size = clamp(k*0.0075, 0.7, 3.4);
      cx2.fillStyle = `rgba(${mo.c},${mo.c},${mo.c+2},${clamp(1.9/dz, 0.22, 0.85)})`;
      cx2.fillRect(px, py, size, size);
    }
  }

  // loose grains
  for(const g of free){
    const [px, py, k, dz] = project(g.x, g.y, g.z);
    const size = clamp(k*0.006, 0.5, 2.6);
    cx2.fillStyle = `rgba(${g.c},${g.c},${g.c+2},${clamp(1.5/dz, 0.16, 0.7)})`;
    cx2.fillRect(px, py, size, size);
  }
}

/* ---------------- boot ---------------- */
loadSaved();
buildSpeciesUI();
buildGlobalUI();
resizeCanvas();
draw();
</script>
