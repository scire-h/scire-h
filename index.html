<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#0b0b0d" />
<title>POKO — analog drum synth</title>
<style>
  :root {
    --bg:      #0b0b0d;
    --panel:   #17171a;
    --panel2:  #202024;
    --line:    #2c2c31;
    --text:    #e8e8ea;
    --dim:     #8b8b92;
    --acc:     #ffb84d;   /* warm amber, 70s panel lamp */
    --acc2:    #5dc6c8;
    --hit:     #ff5d45;
    --pad:     #28406e;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; touch-action:manipulation; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",sans-serif; }
  .app { max-width:560px; margin:0 auto; padding-bottom:140px; }

  /* ---------- header / transport ---------- */
  .top {
    display:flex; align-items:center; gap:8px;
    padding:10px 12px; background:#08080a; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:50;
  }
  .top .logo { font-weight:800; letter-spacing:.12em; color:var(--acc); font-size:14px; }
  .top .spacer { flex:1; }
  .bpm-box { display:flex; align-items:center; gap:4px; }
  .bpm-box button {
    width:38px; height:38px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:18px; font-weight:700;
  }
  .bpm-box .bpm { min-width:54px; text-align:center; font-variant-numeric:tabular-nums;
    font-size:15px; font-weight:700; color:var(--acc); }
  .playBtn {
    width:64px; height:38px; border-radius:8px; border:none;
    background:var(--acc); color:#000; font-size:15px; font-weight:800;
  }
  .playBtn.playing { background:var(--hit); color:#fff; }

  /* ---------- pads ---------- */
  .pads { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; padding:12px; }
  .padBtn {
    aspect-ratio:1/1; border-radius:50%;
    background:radial-gradient(circle at 36% 30%, #45639b, var(--pad) 55%, #14223d 100%);
    border:4px solid #b9b9bd;
    box-shadow:inset 0 -7px 14px rgba(0,0,0,.55), 0 3px 8px rgba(0,0,0,.5);
    color:#dfe6f5; font-size:22px; font-weight:900;
    display:flex; align-items:center; justify-content:center;
    transition:transform 50ms;
  }
  .padBtn:active, .padBtn.hit { transform:scale(.93); box-shadow:inset 0 0 22px rgba(255,93,69,.65); }

  /* ---------- sequencer ---------- */
  .seqWrap { padding:0 12px 12px; }
  .seqRow { display:grid; grid-template-columns:34px repeat(16,1fr); gap:3px; margin-bottom:4px; }
  .seqRow .chLbl {
    display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:var(--dim);
    background:var(--panel); border:1px solid var(--line); border-radius:5px;
  }
  .cell {
    aspect-ratio:1/1.35; border-radius:4px; border:1px solid var(--line);
    background:var(--panel);
  }
  .cell:nth-child(4n+2) { background:#1b1b20; }   /* beat guide */
  .cell.on   { background:var(--acc); border-color:var(--acc); }
  .cell.now  { outline:2px solid var(--acc2); outline-offset:-2px; }
  .cell.on.now { background:#fff; }

  .seqTools { display:flex; gap:8px; padding:0 12px 8px; }
  .seqTools button {
    flex:1; padding:10px 0; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--dim); font-size:12px; font-weight:700; letter-spacing:.06em;
  }

  /* ---------- channel tabs ---------- */
  .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:0 12px 8px; }
  .tabs button {
    padding:11px 0; border-radius:8px; border:1px solid var(--line);
    background:var(--panel); color:var(--dim); font-weight:800; font-size:13px;
  }
  .tabs button.act { background:var(--acc2); color:#000; border-color:var(--acc2); }

  /* ---------- params ---------- */
  .params { padding:0 12px; }
  .sec { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:10px; }
  .sec h3 { margin:0 0 10px; font-size:11px; letter-spacing:.16em; color:var(--dim); font-weight:800; }
  .prow { display:grid; grid-template-columns:78px 1fr 70px; gap:8px; align-items:center; margin-bottom:4px; }
  .prow .lb { font-size:13px; color:#ccc; }
  .prow .vl { text-align:right; font-size:13px; color:var(--acc); font-weight:700; font-variant-numeric:tabular-nums; }
  .prow input[type=range] { -webkit-appearance:none; height:38px; background:transparent; width:100%; margin:0; }
  .prow input[type=range]::-webkit-slider-runnable-track { height:5px; border-radius:3px;
    background:linear-gradient(90deg, var(--acc) var(--p,50%), #2c2c31 var(--p,50%)); }
  .prow input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px;
    border-radius:50%; background:#fff; border:2px solid #000; margin-top:-10.5px; }
  .prow input[type=range]::-moz-range-track { height:5px; background:#2c2c31; border-radius:3px; }
  .prow input[type=range]::-moz-range-thumb { width:24px; height:24px; border-radius:50%;
    background:#fff; border:2px solid #000; }
  .segBtns { display:grid; grid-template-columns:repeat(var(--n,4),1fr); gap:6px; margin-bottom:6px; }
  .segBtns button { padding:12px 0; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--dim); font-weight:800; font-size:13px; }
  .segBtns button.act { background:var(--acc); color:#000; border-color:var(--acc); }

  /* ---------- footer ---------- */
  .foot {
    position:fixed; left:0; right:0; bottom:0; z-index:60;
    background:rgba(8,8,10,.96); backdrop-filter:blur(8px);
    border-top:1px solid var(--line); padding:10px 12px;
  }
  .footIn { max-width:560px; margin:0 auto; display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center; }
  .mvol { display:flex; align-items:center; gap:8px; }
  .mvol .t { font-size:10px; letter-spacing:.1em; color:var(--dim); font-weight:700; }
  .mvol input[type=range] { -webkit-appearance:none; height:30px; flex:1; background:transparent; }
  .mvol input[type=range]::-webkit-slider-runnable-track { height:4px; border-radius:2px; background:#2c2c31; }
  .mvol input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px;
    border-radius:50%; background:var(--acc); border:2px solid #000; margin-top:-9px; }
  .foot select {
    padding:11px 26px 11px 12px; border-radius:8px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:13px; font-weight:700;
    -webkit-appearance:none; appearance:none;
  }

  /* ---------- splash ---------- */
  .splash { position:fixed; inset:0; background:#0b0b0d; z-index:999;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; text-align:center; }
  .splash h1 { color:var(--acc); letter-spacing:.14em; font-size:26px; margin:0; }
  .splash p { color:var(--dim); font-size:14px; line-height:1.7; margin:0; }
  .splash button { margin-top:10px; padding:16px 40px; border:none; border-radius:10px;
    background:var(--acc); color:#000; font-size:17px; font-weight:800; }
</style>
</head>
<body>

<div class="splash" id="splash">
  <h1>POKO</h1>
  <p>アナログ・シンセドラム &amp; シーケンサー<br>1978 年式「ポコポコ」サウンド</p>
  <button id="startBtn">START</button>
</div>

<div class="app" id="app" hidden>
  <div class="top">
    <span class="logo">POKO</span>
    <span class="spacer"></span>
    <div class="bpm-box">
      <button id="bpmDn">−</button>
      <span class="bpm" id="bpmVal">120</span>
      <button id="bpmUp">＋</button>
    </div>
    <button class="playBtn" id="playBtn">▶</button>
  </div>

  <div class="pads" id="pads"></div>

  <div class="seqWrap" id="seq"></div>
  <div class="seqTools">
    <button id="clearBtn">CLEAR</button>
    <button id="randBtn">RANDOM</button>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="params" id="params"></div>
</div>

<div class="foot" id="foot" hidden>
  <div class="footIn">
    <div class="mvol">
      <span class="t">VOL</span>
      <input type="range" id="mvol" min="0" max="1" step="0.001" value="0.7" />
    </div>
    <select id="preset"><option value="">Preset…</option></select>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   POKO — rebuilt from scratch.

   Heart of the sound: real RC curves via setTargetAtTime.

   Analog drum synths shape both pitch and amplitude with capacitor
   discharge:   v(t) = target + (v0 - target) · e^(-t/τ)
   Web Audio's setTargetAtTime() is exactly this curve. The previous
   builds used linearRamp / exponentialRamp, which produce audibly
   different trajectories — that mismatch was the core of the
   "音色が違う" feedback. Pitch settles asymptotically into the base
   frequency (fast drop, soft landing = "poko"), and the amplitude
   tail is a true RC discharge.
   ===================================================================== */

const AC = window.AudioContext || window.webkitAudioContext;
let actx = null, master = null, comp = null;

function audioInit() {
  if (actx) return;
  actx = new AC();
  comp = actx.createDynamicsCompressor();
  comp.threshold.value = -12; comp.knee.value = 20;
  comp.ratio.value = 5; comp.attack.value = .002; comp.release.value = .12;
  master = actx.createGain();
  master.gain.value = state.vol;

  /* Analog-style output stage:
       DC blocker (HP 60 Hz) -- removes any low-end thump from the
         envelope discontinuities, like an analog coupling cap.
       HF rolloff (LP 7 kHz, gentle Q) -- ICL8038 has finite slew rate,
         and the surrounding op-amp stages in a Pollard / ULT-SOUND
         have an audible HF rolloff. Without this Web Audio sounds
         too bright and "digital".  */
  const dc = actx.createBiquadFilter();
  dc.type = "highpass"; dc.frequency.value = 60; dc.Q.value = 0.7;
  const hf = actx.createBiquadFilter();
  hf.type = "lowpass";  hf.frequency.value = 7200; hf.Q.value = 0.6;
  master.connect(dc).connect(hf).connect(comp).connect(actx.destination);
}

/* ICL8038-style "sine" generated by a piecewise-linear waveshaper of
   a triangle (the real chip uses 5 break-points per quarter cycle).
   Spec sheet typical THD ≈ 1 %, dominated by H3 at about −42 dB with
   H5 around −65 dB and H7 around −75 dB. All odd, no even harmonics.
   Web Audio's pure sine has none of this and is the main reason the
   carrier sounds "digital". */
let WARM_SINE = null;
function getWarmSine() {
  if (WARM_SINE) return WARM_SINE;
  if (!actx) return null;
  /* real, imag arrays: index 0 = DC, 1 = fundamental, 2 = 2nd harmonic, ... */
  const real = new Float32Array(10);
  const imag = new Float32Array(10);
  real[1] = 1.0;        // fundamental (0 dB)
  real[3] = 0.0079;     // H3 = -42 dB (ICL8038 signature)
  real[5] = 0.00056;    // H5 = -65 dB
  real[7] = 0.000178;   // H7 = -75 dB
  real[9] = 0.0001;     // H9 = -80 dB
  WARM_SINE = actx.createPeriodicWave(real, imag, { disableNormalization: true });
  return WARM_SINE;
}

/* One-time tanh curve used as a soft VCA saturator. A CA3080 OTA in
   a Pollard / ULT-SOUND VCA saturates the signal gently when the
   control current peaks at hit time -- this is part of the
   characteristic "pakon" attack. We approximate the same curve. */
let VCA_CURVE = null;
function getVcaCurve() {
  if (VCA_CURVE) return VCA_CURVE;
  const n = 2048;
  VCA_CURVE = new Float32Array(n);
  const drive = 1.6;     // gentle (CA3080 is not a hard clipper)
  for (let i = 0; i < n; i++) {
    const x = (i / (n - 1)) * 2 - 1;
    VCA_CURVE[i] = Math.tanh(x * drive) / Math.tanh(drive);
  }
  return VCA_CURVE;
}

let noiseBuf = null;
function getNoise() {
  if (noiseBuf) return noiseBuf;
  const n = actx.sampleRate * 1.5 | 0;
  noiseBuf = actx.createBuffer(1, n, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return noiseBuf;
}

/* ---------------------------------------------------------------
   STATE — params are stored in real musical units.
   --------------------------------------------------------------- */
function mkCh(name, idx) {
  return {
    name, _idx: idx,
    wave:     "sine",   // sine | triangle | square
    tune:     100,      // settle frequency Hz (30..500, log)
    attack:   1.5,      // amp attack time ms (0.5..120, log)
    decay:    140,      // amp RC tau in ms (30..800, log)
    sweepOct: 1.6,      // pitch sweep depth (0..6 oct, panel scale)
    sweepDir: "down",   // "up" | "off" | "down"
    sweepMs:  28,       // pitch RC tau in ms (5..200, log)
    beatTune: 0,        // cents detune offset (0..50)
    lfoOn:    false,    // LFO on/off
    lfoWave:  "sine",   // sine | triangle | square (DS-4 "Pulse" LFO = square)
    lfoRate:  6,        // Hz (0.3..30, log)
    lfoDepth: 30,       // cents (0..200)
    multi:    false,    // PULL: also fire the next channel
    sense:    0.85,     // velocity sensitivity 0..1
    noise:    0,        // 0..1 noise mix
    click:    0.5,      // 0..1 attack click amount
    level:    0.9,      // 0..1
  };
}
const state = {
  vol: 0.7,
  bpm: 120,
  playing: false,
  step: 0,
  activeCh: 0,
  channels: [ mkCh("HI",0), mkCh("MID",1), mkCh("LOW",2), mkCh("KICK",3) ],
  pattern: [
    new Array(16).fill(0), new Array(16).fill(0),
    new Array(16).fill(0), new Array(16).fill(0),
  ],
};

/* ---------------------------------------------------------------
   VOICE — one trigger. All curves are setTargetAtTime RC shapes.
   --------------------------------------------------------------- */
function trigger(ch, vel = 1, when = null, cascadeFrom = null) {
  audioInit();
  if (actx.state === "suspended") actx.resume();
  const t = when ?? actx.currentTime;

  /* SENSE LEVEL: per-channel velocity sensitivity (panel knob on DS-4) */
  const senseVel = ch.sense + (1 - ch.sense) * vel;
  const peak = ch.level * senseVel;
  if (peak <= 0.001) return;

  /* SWEEP DIRECTION: panel UP / OFF / DOWN */
  const f1 = ch.tune;
  let f0;
  if (ch.sweepDir === "off")      f0 = f1;
  else if (ch.sweepDir === "up")  f0 = f1 / Math.pow(2, ch.sweepOct);
  else                            f0 = f1 * Math.pow(2, ch.sweepOct);    // down
  const tauP = ch.sweepMs / 1000;
  const tauA = ch.decay  / 1000;
  const atkS = Math.max(0.0006, ch.attack / 1000);

  /* ----- tone ----- */
  const osc = actx.createOscillator();
  if (ch.wave === "sine") {
    const pw = getWarmSine();
    if (pw) osc.setPeriodicWave(pw);
    else    osc.type = "sine";
  } else {
    osc.type = ch.wave;
  }

  /* per-hit drift ±4 cents + BEAT TUNE static detune */
  osc.detune.value = (Math.random() - 0.5) * 8 + ch.beatTune;

  /* slow analog drift wobble */
  const driftLFO  = actx.createOscillator();
  driftLFO.type = "sine";
  driftLFO.frequency.value = 0.6 + Math.random() * 0.5;
  const driftAmp  = actx.createGain();
  driftAmp.gain.value = 2.0;
  driftLFO.connect(driftAmp).connect(osc.detune);

  /* ----- LFO (panel section) ----- */
  let lfo = null, lfoG = null;
  if (ch.lfoOn && ch.lfoDepth > 0.1) {
    lfo = actx.createOscillator();
    /* Pollard / DS-4 "Pulse" LFO is a square -- the rhythmic stutter
       you hear on classic late-70s synth drums comes from a square
       LFO modulating VCO pitch fast. */
    lfo.type = ch.lfoWave;          // "sine" | "triangle" | "square"
    lfo.frequency.value = ch.lfoRate;
    lfoG = actx.createGain();
    lfoG.gain.value = ch.lfoDepth;  // depth is already in cents
    lfo.connect(lfoG).connect(osc.detune);
  }

  /* pitch RC sweep */
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.setTargetAtTime(f1, t, tauP);

  /* amp envelope: linear ATTACK rise, then RC discharge */
  const vca = actx.createGain();
  vca.gain.setValueAtTime(0, t);
  vca.gain.linearRampToValueAtTime(peak, t + atkS);
  vca.gain.setTargetAtTime(0, t + atkS, tauA);

  /* OTA-style soft saturation */
  const sat = actx.createWaveShaper();
  sat.curve = getVcaCurve();
  sat.oversample = "2x";

  osc.connect(vca).connect(sat).connect(master);
  const stopAt = t + tauA * 8 + atkS + 0.15;
  osc.start(t);
  osc.stop(stopAt);
  driftLFO.start(t);
  driftLFO.stop(stopAt);
  if (lfo) { lfo.start(t); lfo.stop(stopAt); }

  /* ----- noise layer (snare wires / hat sizzle) ----- */
  if (ch.noise > 0.003) {
    const nz = actx.createBufferSource();
    nz.buffer = getNoise(); nz.loop = true;
    const flt = actx.createBiquadFilter();
    flt.type = "bandpass";
    flt.frequency.setValueAtTime(Math.min(12000, f1 * 18), t);
    flt.frequency.setTargetAtTime(Math.min(9000, f1 * 9), t, tauP * 2);
    flt.Q.value = 0.9;
    const ng = actx.createGain();
    ng.gain.setValueAtTime(0, t);
    ng.gain.linearRampToValueAtTime(peak * ch.noise * 0.8, t + 0.0006);
    ng.gain.setTargetAtTime(0, t + 0.0006, tauA * 0.7);
    nz.connect(flt).connect(ng).connect(master);
    nz.start(t); nz.stop(stopAt);
  }

  /* ----- attack click (piezo / stick impact) -----
     Pollard's signature attack 'thock' comes from the piezo trigger
     pulse bleeding through the signal path. A short broadband
     transient band-passed around 1.8 kHz gives that characteristic
     wooden stick-on-drumhead colour. Resonant filter Q ≈ 4 adds the
     mid-range ring that you hear on every Pollard Syndrum hit. */
  if (ch.click > 0.003) {
    const len = actx.sampleRate * 0.006 | 0;
    const cb = actx.createBuffer(1, len, actx.sampleRate);
    const cd = cb.getChannelData(0);
    for (let i = 0; i < len; i++)
      cd[i] = (Math.random() * 2 - 1) * Math.exp(-i / (actx.sampleRate * 0.0010));
    const ck = actx.createBufferSource(); ck.buffer = cb;
    /* mid-band ringing filter for stick character (1.5-2.2 kHz) */
    const ringHz = 1500 + Math.random() * 700;
    const flt = actx.createBiquadFilter();
    flt.type = "bandpass";
    flt.frequency.value = ringHz;
    flt.Q.value = 4.0;
    const cg = actx.createGain();
    cg.gain.value = peak * ch.click * 0.9;
    ck.connect(flt).connect(cg).connect(master);
    ck.start(t);
  }

  /* ----- MULTI VCO PULL (DS-4 cascade) -----
     When PULL is engaged, triggering this channel also fires the
     next one with slight pitch offset, like the panel cascade
     trigger on the original instrument. cascadeFrom prevents
     infinite loops. */
  if (ch.multi && cascadeFrom !== ch._idx) {
    const next = state.channels[(ch._idx + 1) % 4];
    /* 4 ms stagger so you hear two separate transients */
    trigger(next, vel * 0.85, t + 0.004, ch._idx);
  }
}

/* ---------------------------------------------------------------
   SEQUENCER — lookahead scheduler on the audio clock.
   --------------------------------------------------------------- */
let schedTimer = null, nextNoteTime = 0;
const LOOKAHEAD_MS = 25, AHEAD_S = 0.12;

function stepDur() { return 60 / state.bpm / 4; }   // 16ths

function schedulerTick() {
  while (nextNoteTime < actx.currentTime + AHEAD_S) {
    const s = state.step;
    for (let c = 0; c < 4; c++) {
      if (state.pattern[c][s]) {
        trigger(state.channels[c], 0.95, nextNoteTime);
        blinkPad(c);
      }
    }
    markStep(s, nextNoteTime);
    state.step = (s + 1) % 16;
    nextNoteTime += stepDur();
  }
}
function play() {
  audioInit();
  if (actx.state === "suspended") actx.resume();
  state.playing = true; state.step = 0;
  nextNoteTime = actx.currentTime + 0.06;
  schedTimer = setInterval(schedulerTick, LOOKAHEAD_MS);
  els.playBtn.textContent = "■";
  els.playBtn.classList.add("playing");
}
function stop() {
  state.playing = false;
  clearInterval(schedTimer); schedTimer = null;
  els.playBtn.textContent = "▶";
  els.playBtn.classList.remove("playing");
  document.querySelectorAll(".cell.now").forEach(c => c.classList.remove("now"));
}

/* visual step cursor, scheduled to land with the audio */
function markStep(s, when) {
  const delay = Math.max(0, (when - actx.currentTime) * 1000);
  setTimeout(() => {
    if (!state.playing) return;
    document.querySelectorAll(".cell.now").forEach(c => c.classList.remove("now"));
    document.querySelectorAll(`.cell[data-s="${s}"]`).forEach(c => c.classList.add("now"));
  }, delay);
}

/* ---------------------------------------------------------------
   UI
   --------------------------------------------------------------- */
const els = {};
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function buildPads() {
  els.pads.innerHTML = "";
  state.channels.forEach((ch, i) => {
    const b = el("button", "padBtn", String(i + 1));
    b.addEventListener("pointerdown", e => {
      e.preventDefault();
      trigger(ch, 1);
      b.classList.add("hit");
      setTimeout(() => b.classList.remove("hit"), 90);
    });
    ch._pad = b;
    els.pads.appendChild(b);
  });
}
function blinkPad(c) {
  const b = state.channels[c]._pad;
  if (!b) return;
  b.classList.add("hit");
  setTimeout(() => b.classList.remove("hit"), 80);
}

function buildSeq() {
  els.seq.innerHTML = "";
  state.channels.forEach((ch, c) => {
    const row = el("div", "seqRow");
    row.appendChild(el("div", "chLbl", ch.name));
    for (let s = 0; s < 16; s++) {
      const cell = el("div", "cell" + (state.pattern[c][s] ? " on" : ""));
      cell.dataset.s = s;
      cell.addEventListener("pointerdown", e => {
        e.preventDefault();
        state.pattern[c][s] = state.pattern[c][s] ? 0 : 1;
        cell.classList.toggle("on", !!state.pattern[c][s]);
        if (state.pattern[c][s]) trigger(ch, 0.8);   // audition on placing
      });
      row.appendChild(cell);
    }
    els.seq.appendChild(row);
  });
}

function buildTabs() {
  els.tabs.innerHTML = "";
  state.channels.forEach((ch, i) => {
    const b = el("button", i === state.activeCh ? "act" : "", ch.name);
    b.addEventListener("click", () => { state.activeCh = i; buildTabs(); buildParams(); });
    els.tabs.appendChild(b);
  });
}

/* log-scale slider helper: maps [0,1] <-> [lo,hi] exponentially */
function logMap(lo, hi) {
  return {
    to01: v => Math.log(v / lo) / Math.log(hi / lo),
    from01: p => lo * Math.pow(hi / lo, p),
  };
}
function prow(label, get, set, fmtFn, map) {
  const row = el("div", "prow");
  row.appendChild(el("span", "lb", label));
  const inp = document.createElement("input");
  inp.type = "range"; inp.min = 0; inp.max = 1; inp.step = 0.001;
  inp.value = map ? map.to01(get()) : get();
  const vl = el("span", "vl", fmtFn(get()));
  const paint = () => {
    inp.style.setProperty("--p", (parseFloat(inp.value) * 100).toFixed(1) + "%");
    vl.textContent = fmtFn(get());
  };
  paint();
  inp.addEventListener("input", () => {
    const raw = parseFloat(inp.value);
    set(map ? map.from01(raw) : raw);
    paint();
  });
  /* audition on release so you hear the result of the tweak */
  inp.addEventListener("change", () => trigger(state.channels[state.activeCh], 0.85));
  row.appendChild(inp);
  row.appendChild(vl);
  return row;
}

const mTune  = logMap(30, 500);
const mDecay = logMap(30, 800);
const mAtk   = logMap(0.5, 120);
const mSwMs  = logMap(5, 200);
const mLfo   = logMap(0.3, 30);

/* generic segmented-button picker */
function picker(values, labels, get, set, sideEffect) {
  const seg = el("div", "segBtns");
  seg.style.setProperty("--n", values.length);
  values.forEach((v, i) => {
    const b = el("button", get() === v ? "act" : "", labels[i]);
    b.addEventListener("click", () => {
      set(v);
      seg.querySelectorAll("button").forEach((x, j) => x.classList.toggle("act", values[j] === v));
      if (sideEffect) sideEffect();
    });
    seg.appendChild(b);
  });
  return seg;
}

function toggleRow(label, get, set, sideEffect) {
  const row = el("div", "prow");
  row.style.gridTemplateColumns = "78px 1fr";
  row.appendChild(el("span", "lb", label));
  const b = el("button", "", get() ? "ON" : "OFF");
  b.style.cssText = "padding:10px 0; border-radius:8px; border:1px solid var(--line); font-weight:800; font-size:13px;"
                  + (get() ? "background:var(--acc); color:#000; border-color:var(--acc);"
                           : "background:var(--panel2); color:var(--dim);");
  b.addEventListener("click", () => {
    set(!get());
    b.textContent = get() ? "ON" : "OFF";
    b.style.cssText = "padding:10px 0; border-radius:8px; border:1px solid var(--line); font-weight:800; font-size:13px;"
                    + (get() ? "background:var(--acc); color:#000; border-color:var(--acc);"
                             : "background:var(--panel2); color:var(--dim);");
    if (sideEffect) sideEffect();
  });
  row.appendChild(b);
  return row;
}

function buildParams() {
  els.params.innerHTML = "";
  const ch = state.channels[state.activeCh];
  const ping = () => trigger(ch, 0.85);

  /* ---------- TONE ---------- */
  const tone = el("div", "sec");
  tone.appendChild(el("h3", null, "TONE"));
  tone.appendChild(picker(["sine","triangle","square"], ["SIN","TRI","SQR"],
                          () => ch.wave, v => ch.wave = v, ping));
  tone.appendChild(prow("Tune",   () => ch.tune,   v => ch.tune   = v, v => v.toFixed(0) + " Hz", mTune));
  tone.appendChild(prow("Attack", () => ch.attack, v => ch.attack = v, v => v.toFixed(1) + " ms", mAtk));
  tone.appendChild(prow("Decay",  () => ch.decay,  v => ch.decay  = v, v => v.toFixed(0) + " ms", mDecay));
  els.params.appendChild(tone);

  /* ---------- PITCH SWEEP ---------- */
  const sw = el("div", "sec");
  sw.appendChild(el("h3", null, "PITCH SWEEP"));
  sw.appendChild(picker(["up","off","down"], ["UP","OFF","DOWN"],
                        () => ch.sweepDir, v => ch.sweepDir = v, ping));
  sw.appendChild(prow("Depth", () => ch.sweepOct, v => ch.sweepOct = v,
                      v => v.toFixed(2) + " oct",
                      { to01: v => v / 6, from01: p => p * 6 }));
  sw.appendChild(prow("Speed", () => ch.sweepMs,  v => ch.sweepMs  = v, v => v.toFixed(0) + " ms", mSwMs));
  els.params.appendChild(sw);

  /* ---------- LFO ----------
     Pollard / DS-4 LFO modulates VCO pitch. SQR / "Pulse" LFO at a
     few Hz gives the characteristic stutter on classic late-70s
     synth drums. */
  const lfo = el("div", "sec");
  lfo.appendChild(el("h3", null, "LFO (VCO MOD)"));
  lfo.appendChild(toggleRow("Enable", () => ch.lfoOn, v => ch.lfoOn = v, ping));
  lfo.appendChild(picker(["sine","triangle","square"], ["∿ SIN","△ TRI","⊓ PULSE"],
                         () => ch.lfoWave, v => ch.lfoWave = v, ping));
  lfo.appendChild(prow("Rate",  () => ch.lfoRate,  v => ch.lfoRate  = v, v => v.toFixed(1) + " Hz",  mLfo));
  lfo.appendChild(prow("Depth", () => ch.lfoDepth, v => ch.lfoDepth = v,
                       v => v.toFixed(0) + " ct",
                       { to01: v => v / 200, from01: p => p * 200 }));
  els.params.appendChild(lfo);

  /* ---------- MIX ---------- */
  const mix = el("div", "sec");
  mix.appendChild(el("h3", null, "MIX"));
  mix.appendChild(prow("Noise", () => ch.noise, v => ch.noise = v, v => Math.round(v*100) + "%"));
  mix.appendChild(prow("Click", () => ch.click, v => ch.click = v, v => Math.round(v*100) + "%"));
  mix.appendChild(prow("Level", () => ch.level, v => ch.level = v, v => Math.round(v*100) + "%"));
  els.params.appendChild(mix);

  /* ---------- DS-4 EXTRAS ---------- */
  const adv = el("div", "sec");
  adv.appendChild(el("h3", null, "DS-4 EXTRAS"));
  adv.appendChild(prow("Beat Tune", () => ch.beatTune, v => ch.beatTune = v,
                       v => v.toFixed(0) + " ct",
                       { to01: v => v / 50, from01: p => p * 50 }));
  adv.appendChild(prow("Sense",     () => ch.sense,    v => ch.sense    = v, v => Math.round(v*100) + "%"));
  adv.appendChild(toggleRow("Multi VCO", () => ch.multi, v => ch.multi = v, ping));
  const note = el("div");
  note.style.cssText = "font-size:11px; color:var(--dim); margin-top:4px; line-height:1.5;";
  note.innerHTML = "Multi VCO = この ch を叩くと隣 ch も同時発火 (DS-4 PULL カスケード)";
  adv.appendChild(note);
  els.params.appendChild(adv);
}

/* ---------------------------------------------------------------
   PRESETS — sound + pattern together.

}

/* ---------------------------------------------------------------
   WIRE-UP
   --------------------------------------------------------------- */
function refreshAll() {
  buildPads(); buildSeq(); buildTabs(); buildParams();
  els.bpmVal.textContent = state.bpm;
}

document.getElementById("startBtn").addEventListener("click", () => {
  audioInit();
  if (actx.state === "suspended") actx.resume();
  document.getElementById("splash").remove();
  document.getElementById("app").hidden = false;
  document.getElementById("foot").hidden = false;

  els.pads   = document.getElementById("pads");
  els.seq    = document.getElementById("seq");
  els.tabs   = document.getElementById("tabs");
  els.params = document.getElementById("params");
  els.bpmVal = document.getElementById("bpmVal");
  els.playBtn= document.getElementById("playBtn");

  /* default to the Thousand Knives patch + pattern */
  PRESETS.thousand.apply();
  refreshAll();

  els.playBtn.addEventListener("click", () => state.playing ? stop() : play());
  document.getElementById("bpmUp").addEventListener("click", () => {
    state.bpm = Math.min(200, state.bpm + 2); els.bpmVal.textContent = state.bpm;
  });
  document.getElementById("bpmDn").addEventListener("click", () => {
    state.bpm = Math.max(60, state.bpm - 2); els.bpmVal.textContent = state.bpm;
  });
  document.getElementById("clearBtn").addEventListener("click", () => {
    PRESETS.empty.apply(); buildSeq();
  });
  document.getElementById("randBtn").addEventListener("click", () => {
    for (let c = 0; c < 4; c++)
      for (let s = 0; s < 16; s++)
        state.pattern[c][s] = Math.random() < (c === 3 ? 0.28 : 0.18) ? 1 : 0;
    buildSeq();
  });
  const mv = document.getElementById("mvol");
  mv.value = state.vol;
  mv.addEventListener("input", () => {
    state.vol = parseFloat(mv.value);
    if (master) master.gain.value = state.vol;
  });
  const sel = document.getElementById("preset");
  Object.entries(PRESETS).forEach(([k, p]) => {
    const o = document.createElement("option");
    o.value = k; o.textContent = p.name;
    sel.appendChild(o);
  });
  sel.addEventListener("change", () => {
    const p = PRESETS[sel.value];
    if (p) { p.apply(); refreshAll(); }
    sel.value = "";
  });

  /* keyboard 1-4 (desktop) */
  window.addEventListener("keydown", e => {
    if (e.repeat) return;
    if (e.key === " ") { e.preventDefault(); state.playing ? stop() : play(); return; }
    const i = "1234".indexOf(e.key);
    if (i >= 0) {
      trigger(state.channels[i], 1);
      blinkPad(i);
    }
  });
});
